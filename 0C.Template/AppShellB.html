}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }      

body {
    font-family: var(--main-font);
    font-size: var(--base-font-size);
    background: var(--bg-gradient);

}

.content-section { display: none; padding: var(--space-md); animation: fadeIn 0.4s ease; }
.content-section.active { display: block; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* Shared Layouts */
.card {
    background: var(--card-bg);
    border: 2px solid var(--accent-dark);

    <script>
        // --- Fixed Data (Placeholders for specific app configuration) ---
        var __firebase_config = '{}'; // Placeholder: Will be replaced by app-specific config
        var __app_id = 'app-shell-b'; // Placeholder: Will be replaced by app-specific ID
        var __initial_auth_token; // Optional: If you have an initial auth token

        var user = null; // Global user object for Firebase Auth state
        var logs = []; // Placeholder for app-specific logs, load with APP_CORE.getLocal

        // Global Firebase instances (compat versions), initialized by APP_CORE
        var db = null;
        var auth = null;

        // --- Core JS Library - Inlined ---
        /**
         * Core JS Library - Project Universal Logic
         * Path: /public/01js/core.js
         * V2.1.2 - Enhanced Global Availability & Local Compatibility
         */

        var APP_CORE = {
            version: "2.1.2",
            // 1. Firebase Configuration (Centralized)
            firebaseConfig: {}, // Will be set by __firebase_config in APP_CORE.init
            db: null,
            _initialized: false,

            // 2. Initialization
            init: function() {
                if (this._initialized) return;
                console.log("Core: Initializing v" + this.version);
                
                // Set firebaseConfig from global placeholder
                try {
                    this.firebaseConfig = JSON.parse(__firebase_config);
                } catch (e) {
                    this.handleError(e, "解析 Firebase 配置");
                }


                if (typeof firebase !== 'undefined' && this.firebaseConfig && Object.keys(this.firebaseConfig).length > 0) {
                    try {
                        // Initialize Firebase with compat versions
                        firebase.initializeApp(this.firebaseConfig);
                        auth = firebase.auth(); // Set global auth
                        db = firebase.firestore(); // Set global db for Firestore
                        console.log("Core: Firebase Initialized with Firestore");

                        // Listen for auth state changes
                        auth.onAuthStateChanged(function(currentUser) {
                            user = currentUser; // Set global user
                            if (user) {
                                console.log("Firebase user logged in:", user.uid);
                                // Placeholder for app-specific cloud listener
                                if (typeof listenToCloud === 'function') listenToCloud();
                            } else {
                                console.log("No Firebase user logged in.");
                                // Placeholder for app-specific auth init
                                if (typeof initAuth === 'function') initAuth();
                            }
                        });

                    } catch (e) { 
                        console.error("Core: Firebase Init Error", e);
                        APP_CORE.handleError(e, "Firebase 初始化失敗"); // Unified error handling
                    }   
                } else if (typeof firebase !== 'undefined') {
                    console.warn("Core: Firebase not initialized. No config or firebase not available.");
                }
                
                this.switchTab('mainTab'); // Default to mainTab
                this._initialized = true;
                
                // Notify any listeners that core is ready
                window.dispatchEvent(new CustomEvent('coreReady', { detail: { core: this } }));
            },

            // 3. UI Components (No Alerts)
            showToast: function(msg, duration) {
                duration = duration || 3000;
                var t = document.getElementById('toast');
                if (!t) {
                    // Create toast element if it doesn't exist
                    t = document.createElement('div');
                    t.id = 'toast';
                    t.className = 'toast';
                    document.body.appendChild(t);
                }
                t.textContent = msg;
                t.style.display = 'block';
                t.style.opacity = '1'; // Ensure it's visible
                setTimeout(function() {
                    if(t) { // Check if element still exists
                        t.style.opacity = '0'; // Fade out
                        t.addEventListener('transitionend', function handler() {
                            t.style.display = 'none'; // Hide after fade
                            t.removeEventListener('transitionend', handler);
                        });
                    }
                }, duration);
            },

            toggleSpinner: function(show) {
                var s = document.getElementById('spinner');
                if (!s) {
                    s = document.createElement('div');
                    s.id = 'spinner';
                    s.className = 'spinner-overlay';
                    s.innerHTML = '<div class="loader"></div><p id="spinner-text" style="margin-top:10px; font-weight:bold; color:var(--accent-dark);">Processing...</p>';
                    document.body.appendChild(s);
                }
                if(typeof show === 'string') {
                    var spinnerText = document.getElementById('spinner-text');
                    if (spinnerText) spinnerText.textContent = show;
                }
                s.style.display = show ? 'flex' : 'none';
            },

            // 4. Tab System
            switchTab: function(tabId) { // Handles tab switching logic
                var i; // Declare i for loop
                var contentSections = document.querySelectorAll('.content-section');
                for (i = 0; i < contentSections.length; i++) {
                    contentSections[i].classList.remove('active');
                }

                var tabButtons = document.querySelectorAll('.tab-btn');
                for (i = 0; i < tabButtons.length; i++) {
                    tabButtons[i].classList.remove('active');
                }

                var targetContent = document.getElementById(tabId);
                // Use a more robust way to find the button, matching the onclick attribute directly
                var targetBtn = document.querySelector('[onclick*="APP_CORE.switchTab(\x27' + tabId + '\x27)"]'); 
                
                if (targetContent) targetContent.classList.add('active');        
                if (targetBtn) targetBtn.classList.add('active');

                // Custom event for page-specific tab logic
                window.dispatchEvent(new CustomEvent('tabChanged', { detail: { tabId: tabId } }));
            },

            // 5. Data Helpers
            getLocal: function(key) { 
                try {
                    var data = localStorage.getItem(key);
                    return data ? JSON.parse(data) : null; 
                } catch (e) {
                    APP_CORE.handleError(e, "讀取 localStorage ('" + key + "')");
                    return null;
                }
            }, 
            saveLocal: function(key, data) { 
                try {
                    localStorage.setItem(key, JSON.stringify(data)); 
                } catch (e) {
                    APP_CORE.handleError(e, "儲存 localStorage ('" + key + "')");
                }
            },

            // 6. Source Download
            downloadSelf: function(filename) {
                var content = document.documentElement.outerHTML;
                // Get metadata from the top of the HTML file
                var metadataMatch = content.match(/<!--([\s\S]*?)-->/);
                var metadata = '';
                if (metadataMatch && metadataMatch[1]) {
                    metadata = '<!--' + metadataMatch[1] + '-->\x0A';
                }

                var blob = new Blob([metadata + content], { type: 'text/html' });
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename || 'source.html';
                a.click();
            },

            // 7. Error Handling (Unified)
            handleError: function(err, context) {
                console.error("Error in " + context + ":", err);
                var logPanel = document.getElementById('serverLogList'); // Default to serverLogList
                if (!logPanel) { // Fallback to console if serverLogList is not available
                    console.error("Error: serverLogList element not found for logging.");
                } else {
                    var errorMsg = (err && err.message) ? err.message : err;
                    logPanel.innerHTML += '<p style="color:red;">[' + (new Date()).toLocaleTimeString() + '] Error in ' + context + ': ' + errorMsg + '</p>';
                    logPanel.scrollTop = logPanel.scrollHeight; // Scroll to bottom
                }
                APP_CORE.showToast('發生錯誤: ' + context + ' - ' + ((err && err.message) ? err.message : err), 5000);
            }
        };
        // Ensure APP_CORE is globally available
        window.APP_CORE = APP_CORE;

        // --- Global ES5 Functions (Placeholders for app-specific logic) ---
        // These functions will be defined by specific applications that use this App Shell
        // They are included here as empty placeholders to avoid 'undefined' errors
        // during initial load or if an app doesn't implement all of them.

            var el = document.getElementById('msg-bar');

        }

        function analyzeBrain() { APP_CORE.showToast("此分頁功能尚未實作。", 2000); }

        function updateAstroInfo() { /* No default action for template */ }

        function executeHabit() { APP_CORE.showToast("此分頁功能尚未實作。", 2000); }

        function calculateStreak() { return 0; }

        function renderLogs() { 
            var container = document.getElementById('log-container');
            if (container) container.innerHTML = '<div style="text-align:center; padding:10px;">日誌功能尚未實作...</div>';
        }
        function triggerIdeaJail() { APP_CORE.showToast("此分頁功能尚未實作。", 2000); }
        function confirmIdeaJail() { APP_CORE.showToast("此分頁功能尚未實作。", 2000); }
        function cancelIdeaJail() { APP_CORE.showToast("此分頁功能尚未實作。", 2000); }
        function showDisasterPlan() { APP_CORE.showToast("此分頁功能尚未實作。", 2000); }
        function celebrate(label) { /* No default action for template */ }
        function listenToCloud() { /* No default action for template */ }
        function initAuth() { /* No default action for template */ }

        // Call APP_CORE.init() when the window is loaded
        window.addEventListener('load', function() {
            APP_CORE.init();
            // Initial data load for tabs that don't auto-refresh on tab change
            // These will be called if the functions are defined by the app
            if (typeof updateAstroInfo === 'function') updateAstroInfo();
            if (typeof drawCompoundGraph === 'function') drawCompoundGraph();
            if (typeof renderLogs === 'function') renderLogs();
        });

        // Event listener for tab changes
        window.addEventListener('tabChanged', function(e) {
            if (e.detail.tabId === 'brainTab') {
                if (typeof updateAstroInfo === 'function') updateAstroInfo();
            } else if (e.detail.tabId === 'habitsTab') {
                if (typeof drawCompoundGraph === 'function') drawCompoundGraph();
            } else if (e.detail.tabId === 'historyTab') {
                if (typeof renderLogs === 'function') renderLogs();
            }
        });
    </script>
</body>
