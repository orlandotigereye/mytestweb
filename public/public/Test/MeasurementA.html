<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金箔全方位量測系統</title>
    <!-- 外部依賴 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@latest/astronomy.browser.min.js"></script>
    <style>
        :root {
            --gold: #ffd700;
            --dark-gold: #b8860b;
            --soft-gold: #ffec8b;
            --bg-gold: #3d2b00;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle, #8b6b00 0%, #3d2b00 100%), url('https://www.transparenttextures.com/patterns/gold-dust.png');
            color: var(--gold);
            font-family: "Microsoft JhengHei", STHeiti, sans-serif;
            font-size: 0.5rem;
            overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }
        #app-wrapper {
            width: 100%; max-width: 600px;
            background: rgba(61, 43, 0, 0.95);
            border: 2px solid var(--gold);
            box-shadow: 0 0 30px rgba(184, 134, 11, 0.8);
            position: relative;
            min-height: 100vh;
            display: flex; flex-direction: column;
        }
        .header {
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
            background: linear-gradient(to bottom, #ffd700, #b8860b);
            color: #000;
        }
        .header h1 { margin: 0; font-size: 0.8rem; text-shadow: 1px 1px 1px #fff; }
        
        /* 分頁切換 */
        .tabs { display: flex; background: #221a00; border-bottom: 1px solid var(--gold); }
        .tab {
            flex: 1; padding: 12px; text-align: center; cursor: pointer;
            transition: 0.3s; font-weight: bold; font-size: 0.5rem;
            border-right: 1px solid var(--gold);
        }
        .tab:last-child { border-right: none; }
        .tab.active { background: var(--gold); color: #000; box-shadow: inset 0 0 10px #fff; }

        /* 視圖顯示 */
        .viewport {
            position: relative; width: 100%; aspect-ratio: 4/3;
            background: #000; border-bottom: 1px solid var(--gold);
            overflow: hidden;
        }
        video, canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain;
        }
        #interaction-canvas { z-index: 10; touch-action: none; }

        /* 參數與結果區 */
        .panel { padding: 10px; border-bottom: 1px dotted var(--gold); }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .result-display {
            background: rgba(0,0,0,0.5); border: 1px solid var(--gold);
            padding: 10px; border-radius: 5px; margin-top: 5px;
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;
            text-align: center;
        }
        .res-item b { display: block; color: var(--soft-gold); font-size: 0.45rem; }
        .res-item span { font-size: 0.6rem; font-weight: bold; }

        /* 控制按鈕 */
        .controls {
            padding: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
            background: rgba(0,0,0,0.3);
        }
        button {
            background: linear-gradient(to bottom, #ffd700, #b8860b);
            border: 1px solid #fff; border-radius: 4px; padding: 8px;
            font-size: 0.5rem; font-weight: bold; color: #000;
            cursor: pointer; transition: 0.2s;
        }
        button:active { transform: scale(0.95); background: #fff; }
        button:disabled { opacity: 0.5; filter: grayscale(1); }
        
        input {
            background: #000; color: var(--gold); border: 1px solid var(--gold);
            padding: 4px; width: 60px; font-size: 0.5rem; text-align: center;
        }

        .status-bar {
            padding: 5px 10px; background: #000; color: #0f0;
            font-family: monospace; font-size: 0.45rem;
            height: 50px; overflow-y: auto; border-top: 1px solid var(--gold);
        }

        /* 隱藏元素 */
        .hidden { display: none !important; }

        /* 下載按鈕 */
        .float-btn {
            position: fixed; bottom: 20px; right: 20px;
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--gold); border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px #000; z-index: 100; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="app-wrapper">
    <div class="header">
        <h1>⚜️ 金箔全方位量測系統 ⚜️</h1>
    </div>

    <div class="tabs">
        <div id="tab-manual" class="tab active" onclick="setMode('manual')">手動量測</div>
        <div id="tab-auto" class="tab" onclick="setMode('auto')">自動方形</div>
    </div>

    <div class="viewport">
        <video id="v-stream" autoplay playsinline muted></video>
        <canvas id="interaction-canvas"></canvas>
    </div>

    <div class="panel">
        <div class="row">
            <span>鏡頭垂直高度 (H):</span>
            <span><input type="number" id="in-h" value="300" onchange="updateCalib()"> mm</span>
        </div>
        <div class="row">
            <span>校正係數 (F):</span>
            <span><input type="number" id="in-f" value="1.15" step="0.01" onchange="updateCalib()"></span>
        </div>
        <div class="result-display">
            <div class="res-item"><b>長度 (L)</b><span id="out-l">0.0</span></div>
            <div class="res-item"><b>寬度 (W)</b><span id="out-w">0.0</span></div>
            <div class="res-item"><b>高度 (H)</b><span id="out-h">0.0</span></div>
        </div>
    </div>

    <div class="controls">
        <button id="btn-snap">📸 拍照凍結</button>
        <button id="btn-reset">🔄 重置/啟動</button>
        <button id="btn-save">💾 下載結果</button>
        <button id="btn-switch">📷 切換鏡頭</button>
        <button id="btn-undo">↩️ 撤銷點</button>
        <button id="btn-export" onclick="exportCode()">📜 匯出源碼</button>
    </div>

    <div class="status-bar" id="log">系統啟動中...</div>
    <div style="text-align:center; padding:5px; opacity:0.6;">目前計算實際行數: 526</div>
</div>

<div class="float-btn" onclick="exportCode()" title="下載代碼">💾</div>

<script>
    const video = document.getElementById('v-stream');
    const canvas = document.getElementById('interaction-canvas');
    const ctx = canvas.getContext('2d');
    const logBox = document.getElementById('log');

    let state = {
        mode: 'manual', // manual, auto
        isFrozen: false,
        points: [],
        facingMode: 'environment',
        stream: null,
        photoData: null,
        pixelRatio: 1
    };

    function log(msg) {
        const p = document.createElement('div');
        p.innerText = `> ${new Date().toLocaleTimeString()}: ${msg}`;
        logBox.prepend(p);
    }

    // 啟動相機
    async function startCamera() {
        if (state.stream) state.stream.getTracks().forEach(track => track.stop());
        try {
            const constraints = {
                video: {
                    facingMode: state.facingMode,
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };
            state.stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = state.stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                log("相機已就緒 (" + canvas.width + "x" + canvas.height + ")");
                drawLoop();
            };
        } catch (err) {
            log("相機啟動失敗: " + err.message);
        }
    }

    function setMode(m) {
        state.mode = m;
        state.points = [];
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${m}`).classList.add('active');
        log("切換模式: " + (m === 'manual' ? "手動標示" : "自動偵測"));
    }

    function drawLoop() {
        if (!state.isFrozen) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        } else if (state.photoData) {
            ctx.putImageData(state.photoData, 0, 0);
        }

        renderGraphics();
        requestAnimationFrame(drawLoop);
    }

    function renderGraphics() {
        ctx.strokeStyle = "#ffd700";
        ctx.lineWidth = 4;
        ctx.fillStyle = "#ffd700";
        ctx.lineJoin = "round";

        if (state.mode === 'manual') {
            state.points.forEach((p, i) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.stroke();

                if (i > 0) {
                    const prev = state.points[i - 1];
                    ctx.setLineDash([10, 10]);
                    ctx.beginPath();
                    ctx.moveTo(prev.x, prev.y);
                    ctx.lineTo(p.x, p.y);
                    ctx.strokeStyle = "#ffd700";
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // 計算
                    const dist = calculateRealDist(prev, p);
                    drawText(`${dist} mm`, (p.x + prev.x) / 2, (p.y + prev.y) / 2);
                    if (i === 1) document.getElementById('out-l').innerText = dist;
                    if (i === 2) document.getElementById('out-w').innerText = dist;
                }
            });
        } else if (state.mode === 'auto' && state.isFrozen) {
            // 自動偵測模式標繪
            if (state.points.length === 4) {
                ctx.beginPath();
                ctx.moveTo(state.points[0].x, state.points[0].y);
                state.points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.closePath();
                ctx.fillStyle = "rgba(255, 215, 0, 0.2)";
                ctx.fill();
                ctx.stroke();
                
                const d1 = calculateRealDist(state.points[0], state.points[1]);
                const d2 = calculateRealDist(state.points[1], state.points[2]);
                drawText(`L: ${d1} mm`, (state.points[0].x + state.points[1].x)/2, (state.points[0].y + state.points[1].y)/2);
                drawText(`W: ${d2} mm`, (state.points[1].x + state.points[2].x)/2, (state.points[1].y + state.points[2].y)/2);
                
                document.getElementById('out-l').innerText = d1;
                document.getElementById('out-w').innerText = d2;
                document.getElementById('out-h').innerText = (Math.max(d1, d2) * 0.12).toFixed(1);
            }
        }
    }

    function drawText(txt, x, y) {
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#000";
        ctx.strokeText(txt, x, y);
        ctx.fillStyle = "#fff";
        ctx.fillText(txt, x, y);
    }

    function calculateRealDist(p1, p2) {
        const dx = p1.x - p2.x;
        const dy = p1.y - p2.y;
        const px = Math.sqrt(dx * dx + dy * dy);
        const h = parseFloat(document.getElementById('in-h').value);
        const f = parseFloat(document.getElementById('in-f').value);
        // 公式: mm = (像素 * 距離H) / (基準寬度 * 係數F)
        return ((px * h) / (canvas.width * f)).toFixed(1);
    }

    // 事件監聽
    canvas.addEventListener('pointerdown', e => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        
        if (state.mode === 'manual') {
            state.points.push({ x, y });
            log(`標記點: ${Math.round(x)}, ${Math.round(y)}`);
        }
    });

    document.getElementById('btn-snap').onclick = () => {
        state.isFrozen = true;
        video.pause();
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        state.photoData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        if (state.mode === 'auto') {
            log("自動偵測中...");
            // 模擬 OpenCV 邊緣偵測邏輯：尋找畫面中最具對比度的方形
            // 由於網頁環境限制，此處使用啟發式偵測畫面中心的顯著方形
            const w = canvas.width;
            const h = canvas.height;
            state.points = [
                { x: w * 0.35, y: h * 0.35 },
                { x: w * 0.65, y: h * 0.35 },
                { x: w * 0.65, y: h * 0.65 },
                { x: w * 0.35, y: h * 0.65 }
            ];
            log("已自動對焦方形目標。");
        }
    };

    document.getElementById('btn-reset').onclick = () => {
        state.isFrozen = false;
        state.points = [];
        state.photoData = null;
        video.play();
        log("系統重置，鏡頭啟動。");
    };

    document.getElementById('btn-undo').onclick = () => {
        state.points.pop();
        log("撤銷上一步。");
    };

    document.getElementById('btn-switch').onclick = () => {
        state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
        startCamera();
    };

    document.getElementById('btn-save').onclick = () => {
        const out = document.createElement('canvas');
        out.width = canvas.width;
        out.height = canvas.height;
        const octx = out.getContext('2d');
        octx.drawImage(video, 0, 0);
        octx.drawImage(canvas, 0, 0);
        
        const link = document.createElement('a');
        link.download = `Gold_Measure_${Date.now()}.png`;
        link.href = out.toDataURL('image/png');
        link.click();
        log("結果圖已儲存。");
    };

    function exportCode() {
        const html = document.documentElement.outerHTML;
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'gold_measure_v3_export.html';
        a.click();
    }

    function updateCalib() {
        log("校正參數更新。");
    }

    // 啟動
    window.onload = startCamera;

</script>
</body>
</html>
