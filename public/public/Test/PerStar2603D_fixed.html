            // 2. Initialization

                if (APP_CORE._initialized) {

                if (typeof firebase !== 'undefined') {
                    try {
                        firebase.initializeApp(APP_CORE.firebaseConfig);
                        APP_CORE.db = firebase.database();

                    } catch (e) {
                        console.error("Core: Firebase Init Error", e);

                    }   
                }
                
                APP_CORE.setupTabs();
                APP_CORE._initialized = true;
                
                // Notify any listeners that core is ready
                if (typeof window.CustomEvent === 'function') {
                    window.dispatchEvent(new CustomEvent('coreReady', { detail: { core: APP_CORE } }));
                }
            },

            // 3. UI Components (No Alerts)
            showToast: function(msg, duration) {
                duration = duration || 3000;
                var t = document.getElementById('toast');
                if (!t) {
                    t = document.createElement('div');
                    t.id = 'toast';
                    t.className = 'toast';
                    document.body.appendChild(t);
                }
                if (t) { // Check for existence after creation
                    t.textContent = msg;
                    t.style.display = 'block';
                    setTimeout(function() {
                        if (t) t.style.display = 'none'; // Check again before manipulating
                    }, duration);
                }
            },

            toggleSpinner: function(show) {
                var s = document.getElementById('spinner');
                if (!s) {
                    s = document.createElement('div');
                    s.id = 'spinner';
                    s.className = 'spinner-overlay';
                    s.innerHTML = '<div class="loader"></div><p id="spinner-text" style="margin-top:10px; font-weight:bold; color:var(--accent-dark);">Processing...</p>';
                    document.body.appendChild(s);
                }
                if (s) { // Check for existence after creation
                    if (typeof show === 'string') {
                        var spinnerText = document.getElementById('spinner-text');
                        if (spinnerText) spinnerText.textContent = show;
                    }
                    s.style.display = show ? 'flex' : 'none';
                }
            },

            // 4. Tab System
            setupTabs: function() {
                // The window.switchTab is now handled by initApp to manage appState
                // This function can be used for initial setup or other tab-related utilities
                // but should not redefine the global switchTab which relies on appState.
            },

            // 5. Data Helpers
            getLocal: function(key) {
                var item = localStorage.getItem(key);
                try {
                    return JSON.parse(item || '[]');
                } catch (e) {
                    APP_CORE.handleError(e, "getLocal: " + key + " - Invalid JSON in localStorage");
                    return [];
                }
            }, 
            saveLocal: function(key, data) {
                try {
                    localStorage.setItem(key, JSON.stringify(data));
                } catch (e) {
                    APP_CORE.handleError(e, "saveLocal: " + key + " - Error saving to localStorage");
                }
            },

            syncToFirebase: function(path, data) {
                // Return a Promise to allow async/await syntax to work correctly
                return new Promise(function(resolve, reject) {
                    if (!APP_CORE.db || !navigator.onLine) {
                        APP_CORE.showToast("離線模式或Firebase未初始化", "info");
                        return resolve(false);
                    }
                    APP_CORE.db.ref(path).set(data).then(function() {
                        resolve(true);
                    }).catch(function(e) {
                        APP_CORE.handleError(e, "Firebase Sync: " + path);
                        resolve(false);
                    });
                });
            },

            // 6. Source Download
            downloadSelf: function(filename) {
                var content = "<!DOCTYPE html>\x0A" + document.documentElement.outerHTML; // Hex-encoded newline
                var blob = new Blob([content], { type: 'text/html' });
                var a = document.createElement('a');
                if (a) { // Check for existence
                    a.href = URL.createObjectURL(blob);
                    a.download = filename || 'source.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    APP_CORE.showToast("檔案下載已觸發", "success");
                }
            },

            // 7. Unified Error Guard
            handleError: function(err, context) {
                var errorMessage = '錯誤: ' + (context ? context + ' - ' : '') + (err ? err.message || err.toString() : '未知錯誤');
                console.error(errorMessage, err);
                // Optionally log to a visible panel if implemented, or just toast
                APP_CORE.showToast(errorMessage, 5000); // Show for 5 seconds
            }
        };

        // 關鍵修正：立即掛載到 window，確保異步載入時全域物件立即存在
        window.APP_CORE = APP_CORE;

        // Auto-init based on document state
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                console.log('DOMContentLoaded fired.'); // Debug log
                APP_CORE.init(); /* Initialize APP_CORE first */
                initApp();
                console.log('initApp called.'); // Debug log
            });
        } else {
            // Already loaded (e.g., when injected via path_helper after initial load)
            APP_CORE.init();
        }
    </script>

    <script>
        // ==========================================
        // 模組二：Vanilla JS 核心應用程式與 UI
        // ==========================================

        var appState = {
            logs: [],
            activeTab: 'DASHBOARD',
            now: new Date(),
            astroData: null,
            lineCount: 3250, // 全檔預估
            svgRef: null, // DOM reference for SVG
            logPanelElement: null, // DOM reference for log panel
            systemAlertOverlayElement: null, // DOM reference for system alerts
            
            // New states from test1.html
            codes: "31, 16, 17, 68, 94, 89, 78",
            ranking: [],
            selectedPalace: null,
            astrologyDataRaw: null // To store raw astrology_merged.json
        };

        // 系統日誌函數 (取代 useSystemLog)
        function addLog(msg, type) {
            type = type || 'info';
            var id = Date.now() + Math.random();
            appState.logs.push({ id: id, msg: msg, type: type, time: new Date().toLocaleTimeString() });
            appState.logs = appState.logs.slice(-10); // Keep last 10 logs
            
            // Render logs immediately
            renderLogs();

            // Auto-clear from system alerts after 5 seconds
            setTimeout(function() {
                appState.logs = appState.logs.filter(function(log) {
                    return log.id !== id;
                });
                renderLogs(); // Re-render to remove cleared log
            }, 5000);
        }

        // 更新狀態並重新渲染 UI
        function setAppState(newState, callback) {
            // Merge new state into appState
            for (var key in newState) {
                if (newState.hasOwnProperty(key)) {
                    appState[key] = newState[key];
                }
            }
            renderUI(); // Re-render the entire UI or specific parts
            if (typeof callback === 'function') {
                callback();
            }
        }

        // 天文引擎運算
        function calculateAstronomy(date) {
            try {
                var observer = new Astronomy.Observer(25.03, 121.56, 0); // 台中/台北座標概略
                var time = Astronomy.MakeTime(date);
                var bodies = ['Sun', 'Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn'];
                var data = {};
                
                bodies.forEach(function(body) {
                    var equ = Astronomy.Equator(body, time, observer, false, true);
                    data[body] = (equ.ra * 15) % 360; // 轉換為黃道/赤道經度角度
                });
                
                // 計算日干支 (簡化公式)
                var baseDate = new Date(1900, 0, 1);
                var diffDays = Math.floor((date - baseDate) / (1000 * 60 * 60 * 24));
                data.dayGan = GAN[diffDays % 10];
                data.dayZhi = ZHI[(diffDays + 10) % 12];
                
                setAppState({ astroData: data });
            } catch (error) {
                addLog("Astro Error: " + error.message, "error");
                APP_CORE.handleError(error, "calculateAstronomy");
            }
        }

        // D3.js 繪製高精密星盤
        function drawD3Chart() {
            if (appState.activeTab !== 'DASHBOARD') return;
            var svgElement = document.querySelector('#dashboardTab svg');
            if (!appState.astroData || !svgElement) return;
            
            var svg = d3.select(svgElement);
            svg.selectAll("*").remove(); // 清除重繪

            var width = 300;
            var height = 300;
            var radius = Math.min(width, height) / 2 - 20;
            
            var g = svg.append("g")
                .attr("transform", "translate(" + (width / 2) + "," + (height / 2) + ")");

            // 繪製背景盤
            g.append("circle")
                .attr("r", radius)
                .attr("fill", "rgba(0,0,0,0.5)")
                .attr("stroke", "var(--gold-secondary)")
                .attr("stroke-width", 2);

            // 繪製 28 星宿刻度
            TWENTY_EIGHT_MANSIONS.forEach(function(mansion, i) {
                var angle = (mansion.degree - 90) * (Math.PI / 180);
                var x1 = (radius - 15) * Math.cos(angle);
                var y1 = (radius - 15) * Math.sin(angle);
                var x2 = radius * Math.cos(angle);
                var y2 = radius * Math.sin(angle);
                
                g.append("line")
                    .attr("x1", x1).attr("y1", y1).attr("x2", x2).attr("y2", y2)
                    .attr("stroke", "var(--gold-primary)")
                    .attr("stroke-width", 1);
                    
                // 標籤
                var tx = (radius + 8) * Math.cos(angle);
                var ty = (radius + 8) * Math.sin(angle);
                g.append("text")
                    .attr("x", tx).attr("y", ty)
                    .attr("fill", "var(--gold-light)")
                    .attr("font-size", "0.4rem")
                    .attr("text-anchor", "middle")
                    .attr("alignment-baseline", "middle")
                    .text(mansion.name);
            });

            // 繪製行星落點
            var planets = [
                { name: 'Sun', color: '#ff4444', label: '日' },
                { name: 'Moon', color: '#ddddff', label: '月' },
                { name: 'Mars', color: '#ff2222', label: '火' },
                { name: 'Jupiter', color: '#ddaa22', label: '木' }
            ];

            planets.forEach(function(p) {
                if (appState.astroData && appState.astroData[p.name]) {
                    var angle = (appState.astroData[p.name] - 90) * (Math.PI / 180);
                    var px = (radius * 0.7) * Math.cos(angle);
                    var py = (radius * 0.7) * Math.sin(angle);
                    
                    g.append("circle")
                        .attr("cx", px).attr("cy", py)
                        .attr("r", 4)
                        .attr("fill", p.color)
                        .style("filter", "drop-shadow(0 0 3px " + p.color + ")");
                        
                    g.append("text")
                        .attr("x", px + 6).attr("y", py + 3)
                        .attr("fill", "#fff")
                        .attr("font-size", "0.4rem")
                        .attr("font-weight", "bold")
                        .text(p.label);
                }
            });
        }


        // 洛書九宮與八門、財凶計算 (從 test1.html React useMemo 改寫)
        function calculatePalaces() {
            var year = appState.now.getFullYear();
            var center = (11 - (year % 9)) % 9;
            if (center === 0) center = 9;

            var base = [
                { id: 4, n: "東南", g: "杜門", e: "木", o: 4 },
                { id: 9, n: "正南", g: "景門", e: "火", o: 9 },
                { id: 2, n: "西南", g: "死門", e: "土", o: 2 },
                { id: 3, n: "正東", g: "傷門", e: "木", o: 3 },
                { id: 5, n: "中宮", g: "中宮", e: "土", o: 5 },
                { id: 7, n: "正西", g: "驚門", e: "金", o: 7 },
                { id: 8, n: "東北", g: "生門", e: "土", o: 8 },
                { id: 1, n: "正北", g: "休門", e: "水", o: 1 },
                { id: 6, n: "西北", g: "開門", e: "金", o: 6 }
            ];

            var palaces = base.map(function(p) {
                var s = (p.o + (center - 5) + 9) % 9;
                if (s === 0) s = 9;
                var type = "normal";
                var tag = "";
                if ([8, 9, 1].indexOf(s) !== -1) { type = "wealth"; tag = (s === 8 || s === 9) ? "財" : "喜"; } /* Adjusted to handle both 8 and 9 as "財" based on test1 */
                if ([5, 2, 3].indexOf(s) !== -1) { type = "bad"; tag = (s === 5) ? "煞" : "病"; }
                return { id: p.id, n: p.n, g: p.g, e: p.e, o: p.o, star: s, type: type, tag: tag };
            });
            return palaces;
        }

        // 強勢排序邏輯 (從 test1.html React handleSort 改寫)
        function handleSort(input) {
            var list = input.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
            var results = list.map(function(c) {
                var seed = parseInt(c.replace(/[^0-9]/g, '')) || 0;
                return {
                    code: c,
                    score: (75 + (seed % 15) + Math.random() * 10).toFixed(2),

        // 運算 4533 協易機特定分析邏輯 (從 React.useMemo 提取)
        function calculateAnalysis4533() {
            if (!appState.astroData) return null;
            
            // 1. 月亮落宿判斷
            var moonDeg = appState.astroData.Moon;
            var currentMansion = TWENTY_EIGHT_MANSIONS[0];
            var i;
            for (i = 0; i < TWENTY_EIGHT_MANSIONS.length; i++) {
                var nextDeg = (i === TWENTY_EIGHT_MANSIONS.length - 1) ? 360 : TWENTY_EIGHT_MANSIONS[i+1].degree; /* Fixed potential out of bounds */
                var currDeg = TWENTY_EIGHT_MANSIONS[i].degree;
                if (currDeg > nextDeg) { // Handles wrap-around 360 -> 0
                    if (moonDeg >= currDeg || moonDeg < nextDeg) {
                        currentMansion = TWENTY_EIGHT_MANSIONS[i];
                        break;
                    }
                } else {
                    if (moonDeg >= currDeg && moonDeg < nextDeg) {
                        currentMansion = TWENTY_EIGHT_MANSIONS[i];
                        break;
                    }
                }
            }

            // 2. 金運能量指數計算 (金屬性 4533)
            var energyScore = 60; // Base
            if (currentMansion.element === 'Metal') energyScore += 25;
            if (currentMansion.element === 'Earth') energyScore += 15; // 土生金
            if (currentMansion.element === 'Fire') energyScore -= 20;  // 火剋金
            
            // 結合日干支
            var ganWx = WUXING_MAP[appState.astroData.dayGan];
            if (ganWx === 'Metal') energyScore += 10;
            
            // 動態浮動 (基於火星位置，模擬動能)
            var marsFactor = Math.sin(appState.astroData.Mars * Math.PI / 180) * 10;
            energyScore += marsFactor;

            return {
                mansion: currentMansion,
                score: Math.min(Math.max(energyScore, 0), 100).toFixed(1),
                hexagram: I_CHING_64[Math.floor(appState.astroData.Sun % 64)] // 粗略對應
            };
        }
