
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover
">

<title>黃金日記 Ultimate Mobile Pro</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>

<style>

:root{
  --vh:1vh;
}

/* ===== 全域 ===== */

*{
  box-sizing:border-box;
  overscroll-behavior:none;
}

html,
body{

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  overflow:hidden !important;

  touch-action:manipulation;

}

body{

  position:fixed;
  inset:0;

  background:
  radial-gradient(
    circle at center,
    #ffe066 0%,
    #f5b041 50%,
    #cb4335 100%
  );

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  sans-serif;

  color:#78281f;
}

/* ===== 主容器 ===== */

.main-app{

  width:100%;
  max-width:480px;

  height:calc(var(--vh) * 100);

  margin:auto;

  padding:8px;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

/* ===== 卡片 ===== */

.gold-card{

  flex:1;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  border-radius:20px;

  border:3px solid #d4ac0d;

  background:
  linear-gradient(
    135deg,
    #fdf2e9 0%,
    #fbeee6 100%
  );

  box-shadow:
  0 12px 28px rgba(120,40,31,0.35);
}

/* ===== Header ===== */

.header{

  padding:8px;

  border-bottom:2px solid #f4d03f;

  background:#fff7cc;

  flex-shrink:0;
}

.header-title{

  font-size:0.7rem;

  font-weight:bold;
}

/* ===== Tabs ===== */

.tabs{

  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  gap:6px;

  padding:8px;

  background:#fff3cd;

  flex-shrink:0;
}

.tab-btn{

  border:none;

  border-radius:12px;

  padding:8px;

  font-size:0.65rem;

  font-weight:bold;

  background:
  linear-gradient(
    135deg,
    #f1c40f,
    #f39c12
  );

  color:#78281f;
}

.tab-btn.active{

  background:
  linear-gradient(
    135deg,
    #b9770e,
    #d35400
  );

  color:white;
}

/* ===== Tab內容 ===== */

.tab-content{

  flex:1;

  display:none;

  flex-direction:column;

  overflow:hidden;
}

.tab-content.active{
  display:flex;
}

/* ===== 候選列 ===== */

.candidate-bar{

  display:flex;

  overflow-x:auto;

  gap:6px;

  padding:8px;

  background:#fff8dc;

  border-top:2px solid #f4d03f;
  border-bottom:2px solid #f4d03f;

  flex-shrink:0;

  scrollbar-width:none;
}

.candidate-bar::-webkit-scrollbar{
  display:none;
}

.word-btn{

  flex-shrink:0;

  border:none;

  border-radius:999px;

  padding:8px 12px;

  background:white;

  border:2px solid #d4ac0d;

  font-size:0.65rem;

  font-weight:bold;

  white-space:nowrap;
}

/* ===== 編輯器 ===== */

.editor-wrap{

  flex:1;

  overflow:hidden;

  display:flex;
  flex-direction:column;
}

#diaryInput{

  flex:1;

  width:100%;
  height:100%;

  border:none;
  outline:none;

  resize:none;

  overflow:hidden !important;

  background:#fffef8;

  color:#641e16;

  padding:14px;

  font-size:16px !important;

  line-height:1.7;

  white-space:pre-wrap;

  word-break:break-all;

  overflow-wrap:anywhere;

  font-family:
  ui-monospace,
  SFMono-Regular,
  monospace;

  touch-action:manipulation;

  -webkit-overflow-scrolling:none;
}

/* ===== 底部資訊 ===== */

.bottom-info{

  display:flex;

  justify-content:space-between;

  padding:8px;

  background:#fff3cd;

  font-size:0.6rem;

  flex-shrink:0;
}

/* ===== 詞庫 ===== */

.words-list{

  flex:1;

  overflow-y:auto;

  padding:8px;

  display:flex;
  flex-direction:column;

  gap:6px;
}

.word-card{

  padding:8px;

  border-radius:12px;

  background:white;

  border:2px solid #f4d03f;

  font-size:0.7rem;

  display:flex;

  justify-content:space-between;

  align-items:center;
}

/* ===== 歷史 ===== */

.history-list{

  flex:1;

  overflow-y:auto;

  padding:8px;

  display:flex;
  flex-direction:column;

  gap:8px;
}

.history-card{

  padding:10px;

  border-radius:14px;

  background:white;

  border:2px solid #f4d03f;

  font-size:0.7rem;
}

/* ===== 按鈕 ===== */

.gold-btn{

  border:none;

  border-radius:10px;

  padding:8px;

  font-size:0.65rem;

  font-weight:bold;

  background:
  linear-gradient(
    135deg,
    #f1c40f,
    #f39c12
  );

  color:#78281f;
}

/* ===== toast ===== */

.toast{

  position:fixed;

  bottom:20px;

  left:50%;

  transform:translateX(-50%);

  background:#fff3cd;

  border:2px solid #d4ac0d;

  padding:10px 16px;

  border-radius:12px;

  font-size:0.7rem;

  font-weight:bold;

  opacity:0;

  pointer-events:none;

  transition:0.3s;
}

.toast.show{
  opacity:1;
}

</style>
</head>

<body>

<div class="main-app">

<div class="gold-card">

<!-- Header -->

<div class="header">

<div class="flex justify-between items-center">

<div class="header-title">
<i class="fa-solid fa-feather"></i>
黃金日記 Ultimate Mobile Pro
</div>

<div id="saveStatus" style="font-size:0.6rem;">
自動保存
</div>

</div>

</div>

<!-- Tabs -->

<div class="tabs">

<button
class="tab-btn active"
onclick="switchTab('write')"
id="tab-write-btn"
>
寫作
</button>

<button
class="tab-btn"
onclick="switchTab('words')"
id="tab-words-btn"
>
詞庫
</button>

<button
class="tab-btn"
onclick="switchTab('history')"
id="tab-history-btn"
>
歷史
</button>

</div>

<!-- 寫作 -->

<div
class="tab-content active"
id="tab-write"
>

<div
id="candidateBar"
class="candidate-bar"
>

<span style="font-size:0.6rem;">
開始輸入...
</span>

</div>

<div class="editor-wrap">

<textarea
id="diaryInput"
placeholder="開始輸入日記..."
spellcheck="false"
autocorrect="off"
autocomplete="off"
autocapitalize="off"
></textarea>

</div>

<div class="bottom-info">

<div id="charCount">
字數：0
</div>

<div>
14字換行
</div>

</div>

</div>

<!-- 詞庫 -->

<div
class="tab-content"
id="tab-words"
>

<div style="padding:8px;">

<div class="flex gap-2 mb-2">

<input
id="newWord"
placeholder="新增詞"
class="flex-1 p-2 rounded border"
>

<button
class="gold-btn"
onclick="addWord()"
>
新增
</button>

</div>

</div>

<div
id="wordsList"
class="words-list"
></div>

</div>

<!-- 歷史 -->

<div
class="tab-content"
id="tab-history"
>

<div style="padding:8px;">

<button
class="gold-btn w-full"
onclick="saveHistory()"
>
保存目前日記
</button>

</div>

<div
id="historyList"
class="history-list"
></div>

</div>

</div>

</div>

<div
id="toast"
class="toast"
>
已保存
</div>

<script>

/* ===== 字庫 ===== */

const DEFAULT_WORDS = [

"阿凱",
"Anna",
"諾拉",
"莉莉絲",
"芙蕾雅",
"美咲",
"藤田",
"小晴",
"小琪",
"小雅",
"Victoria",
"Emily",
"Luna",
"Lady",
"女媧",
"波塞冬",
"刑天",
"爆炎",
"霜華",
"影刃",
"記憶",
"疼痛",
"身體",
"空間",
"力量",
"絕望",
"崩潰",
"現實",
"靈魂",
"主人",
"房間",
"希望",
"光芒",
"深淵",
"治療",
"精神力",
"生命能量",
"能量",
"虛空",
"時間之力",
"創世之力",
"水元素",
"系統",
"財富",
"投資",
"風險",
"成功率",
"忠誠",
"情緒",
"恐懼",
"習慣",
"預測",
"多巴胺",
"獎勵",
"系統1",
"系統2"

];

/* ===== 資料 ===== */

let appWords = [];
let historyData = [];

/* ===== DOM ===== */

const diaryInput =
document.getElementById(
'diaryInput'
);

const candidateBar =
document.getElementById(
'candidateBar'
);

const charCount =
document.getElementById(
'charCount'
);

const toast =
document.getElementById(
'toast'
);

const wordsList =
document.getElementById(
'wordsList'
);

const historyList =
document.getElementById(
'historyList'
);

/* ===== 初始化 ===== */

window.addEventListener(
'DOMContentLoaded',
() => {

  setAppHeight();

  loadWords();

  loadDraft();

  loadHistory();

  renderWords();

  renderHistory();

  updateChar();

  setTimeout(() => {

    diaryInput.focus();

  },300);

}
);

/* ===== 高度 ===== */

function setAppHeight(){

  const vh =
  window.innerHeight * 0.01;

  document.documentElement
  .style
  .setProperty(
    '--vh',
    `${vh}px`
  );

}

window.addEventListener(
'resize',
setAppHeight
);

/* ===== toast ===== */

function showToast(msg){

  toast.textContent = msg;

  toast.classList.add('show');

  setTimeout(() => {

    toast.classList.remove('show');

  },1000);

}

/* ===== tabs ===== */

function switchTab(tab){

  document
  .querySelectorAll('.tab-content')
  .forEach(el => {
    el.classList.remove('active');
  });

  document
  .querySelectorAll('.tab-btn')
  .forEach(el => {
    el.classList.remove('active');
  });

  document
  .getElementById(
    `tab-${tab}`
  )
  .classList
  .add('active');

  document
  .getElementById(
    `tab-${tab}-btn`
  )
  .classList
  .add('active');

}

/* ===== draft ===== */

function loadDraft(){

  const saved =
  localStorage.getItem(
    'gold_diary_draft'
  );

  if(saved){

    diaryInput.value = saved;

  }

}

function saveDraft(){

  localStorage.setItem(
    'gold_diary_draft',
    diaryInput.value
  );

}

/* ===== history ===== */

function loadHistory(){

  const saved =
  localStorage.getItem(
    'gold_history'
  );

  if(saved){

    historyData =
    JSON.parse(saved);

  }

}

function saveHistory(){

  if(
    !diaryInput.value.trim()
  ){
    return;
  }

  historyData.unshift({

    time:
    new Date()
    .toLocaleString(),

    content:
    diaryInput.value

  });

  localStorage.setItem(
    'gold_history',
    JSON.stringify(historyData)
  );

  renderHistory();

  showToast('已保存歷史');

}

function renderHistory(){

  historyList.innerHTML = '';

  historyData.forEach(item => {

    const div =
    document.createElement('div');

    div.className =
    'history-card';

    div.innerHTML = `
    <div
    style="
    font-size:0.6rem;
    margin-bottom:6px;
    color:#999;
    ">
    ${item.time}
    </div>

    <div>
    ${item.content}
    </div>
    `;

    historyList.appendChild(div);

  });

}

/* ===== words ===== */

function loadWords(){

  const saved =
  localStorage.getItem(
    'gold_words'
  );

  if(saved){

    appWords =
    JSON.parse(saved);

  }else{

    appWords =
    [...DEFAULT_WORDS];

  }

}

function saveWords(){

  localStorage.setItem(
    'gold_words',
    JSON.stringify(appWords)
  );

}

function renderWords(){

  wordsList.innerHTML = '';

  appWords.forEach(word => {

    const div =
    document.createElement('div');

    div.className =
    'word-card';

    div.innerHTML = `

    <div>${word}</div>

    <button
    class="gold-btn"
    onclick="deleteWord('${word}')"
    >
    刪除
    </button>

    `;

    wordsList.appendChild(div);

  });

}

function addWord(){

  const input =
  document.getElementById(
    'newWord'
  );

  const value =
  input.value.trim();

  if(!value) return;

  appWords.push(value);

  saveWords();

  renderWords();

  input.value = '';

  showToast('新增成功');

}

function deleteWord(word){

  appWords =
  appWords.filter(
    w => w !== word
  );

  saveWords();

  renderWords();

}

/* ===== 搜尋 ===== */

function getLastKeyword(text){

  const parts =
  text.split(
  /[\s\n，。,、：；！？]/
  );

  return parts[
    parts.length - 1
  ] || '';

}

function getSuggestions(keyword){

  if(!keyword) return [];

  return appWords
  .filter(word =>
    word.includes(keyword)
  )
  .slice(0,20);

}

/* ===== UI ===== */

function updateSuggestions(){

  const cursor =
  diaryInput.selectionStart;

  const left =
  diaryInput.value.substring(
    0,
    cursor
  );

  const keyword =
  getLastKeyword(left);

  const list =
  getSuggestions(keyword);

  candidateBar.innerHTML = '';

  if(list.length === 0){

    candidateBar.innerHTML =
    `<span style="font-size:0.6rem;">無匹配</span>`;

    return;
  }

  list.forEach(word => {

    const btn =
    document.createElement('button');

    btn.className =
    'word-btn';

    btn.textContent =
    word;

    btn.onclick = () => {
      insertWord(word);
    };

    candidateBar.appendChild(btn);

  });

}

/* ===== 插入 ===== */

function insertWord(word){

  const cursor =
  diaryInput.selectionStart;

  const text =
  diaryInput.value;

  const left =
  text.substring(0,cursor);

  const right =
  text.substring(cursor);

  const keyword =
  getLastKeyword(left);

  const newLeft =
  left.substring(
    0,
    left.length - keyword.length
  );

  diaryInput.value =
  newLeft +
  word +
  ' ' +
  right;

  const pos =
  (newLeft + word + ' ').length;

  diaryInput.focus();

  diaryInput.setSelectionRange(
    pos,
    pos
  );

  updateSuggestions();

  updateChar();

  saveDraft();

}

/* ===== 字數 ===== */

function updateChar(){

  charCount.textContent =
  `字數：${diaryInput.value.length}`;

}

/* ===== 14字換行 ===== */

function autoWrapChineseText(
  text,
  limit = 14
){

  return text
  .split('\n')
  .map(line => {

    let result = '';

    for(
      let i = 0;
      i < line.length;
      i++
    ){

      result += line[i];

      if(
        (i + 1) % limit === 0
      ){

        result += '\n';

      }

    }

    return result;

  })
  .join('\n');

}

let formatting = false;

/* ===== input ===== */

diaryInput.addEventListener(
'input',
() => {

  if(formatting) return;

  formatting = true;

  const cursor =
  diaryInput.selectionStart;

  const original =
  diaryInput.value;

  const formatted =
  autoWrapChineseText(
    original,
    14
  );

  diaryInput.value =
  formatted;

  diaryInput.setSelectionRange(
    cursor,
    cursor
  );

  formatting = false;

  updateSuggestions();

  updateChar();

  saveDraft();

}
);

/* ===== 空白補全 ===== */

diaryInput.addEventListener(
'keydown',
(e) => {

  if(e.key === ' '){

    const cursor =
    diaryInput.selectionStart;

    const left =
    diaryInput.value.substring(
      0,
      cursor
    );

    const keyword =
    getLastKeyword(left);

    const list =
    getSuggestions(keyword);

    if(
      keyword &&
      list.length > 0
    ){

      e.preventDefault();

      insertWord(list[0]);

    }

  }

}
);

/* ===== 防縮放 ===== */

document.addEventListener(
'touchmove',
function(e){

  if(e.scale !== 1){

    e.preventDefault();

  }

},
{ passive:false });

/* ===== 離開前保存 ===== */

window.addEventListener(
'beforeunload',
saveDraft
);

</script>

</body>
</html>
```
