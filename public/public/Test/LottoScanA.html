<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>刮刮樂全功能掃描器</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body { font-family: sans-serif; text-align: center; padding: 12px; }
.wrap { position: relative; display: inline-block; }
video, canvas { width: 100%; max-width: 420px; border: 1px solid #ccc; }
#overlay {
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  pointer-events: none;
}
.scanbox {
  position: absolute; border: 3px solid #00ff88; border-radius: 10px;
  width: 60%; height: 35%;
  left: 20%; top: 32.5%;
  box-shadow: 0 0 0 9999px rgba(0,0,0,0.25);
}
.result { margin-top: 8px; font-size: 20px; font-weight: bold; }
.match { color: green; }
.nomatch { color: red; }
button { margin: 5px; padding: 8px 12px; font-size: 16px; }
</style>
</head>
<body>

<h3>刮刮樂現場 & 相簿掃描器</h3>
<p>尾數：04、13、31、22</p>

<div style="margin-bottom:10px">
  <button onclick="startCamera()">📷 啟動相機</button>
  <button onclick="openGallery()">🖼 從相簿選擇</button>
  <input type="file" id="fileInput" accept="image/*" hidden>
</div>

<div class="wrap">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="position:absolute; left:0; top:0;"></canvas>
  <div id="overlay"><div class="scanbox"></div></div>
</div>

<div id="output" class="result">請選擇模式開始掃描</div>

<script>
const targets = ["04","13","31","22"];
let scanning = false;
let streamTrack;
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const output = document.getElementById("output");

// ---------------------- 相機模式 ----------------------
async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: {ideal:1280}, height: {ideal:720} }
    });
    video.srcObject = stream;
    streamTrack = stream.getVideoTracks()[0];
    scanning = true;
    output.innerText="掃描中...";
    await applyCameraTuning();
    setInterval(scanFrame, 700);
  }catch(e){
    alert("無法開啟相機，請允許權限或使用相簿模式");
    console.log(e);
  }
}

async function applyCameraTuning(){
  if(!streamTrack.getCapabilities) return;
  const caps = streamTrack.getCapabilities();
  const settings = {};
  if(caps.focusMode && caps.focusMode.includes("continuous")) settings.focusMode="continuous";
  if(caps.exposureMode && caps.exposureMode.includes("continuous")) settings.exposureMode="continuous";
  if(caps.exposureCompensation){
    settings.exposureCompensation = caps.exposureCompensation.max ?? 0;
  }
  try{ await streamTrack.applyConstraints({ advanced:[settings] }); }
  catch(e){ console.log("camera tuning not supported"); }
}

function scanFrame(){
  if(!scanning || !video.videoWidth) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const cropW = vw*0.6;
  const cropH = vh*0.35;
  const sx = vw*0.2;
  const sy = vh*0.325;

  canvas.width = video.clientWidth;
  canvas.height = video.clientHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  const ocr = document.createElement("canvas");
  ocr.width = 320; ocr.height = 180;
  const octx = ocr.getContext("2d");
  octx.drawImage(video,sx,sy,cropW,cropH,0,0,ocr.width,ocr.height);

  const img = octx.getImageData(0,0,ocr.width,ocr.height);
  const d = img.data;
  for(let i=0;i<d.length;i+=4){
    const g=(d[i]+d[i+1]+d[i+2])/3;
    const v=g>140?255:0;
    d[i]=d[i+1]=d[i+2]=v;
  }
  octx.putImageData(img,0,0);

  const regions=[];
  const step=20;
  for(let y=0;y<ocr.height;y+=step){
    for(let x=0;x<ocr.width;x+=step){
      const i=(y*ocr.width+x)*4;
      if(d[i]===255) regions.push({x:x-30,y:y-20,w:120,h:60});
    }
  }
  processRegions(ocr,regions.slice(0,5),sx,sy,cropW,cropH);
}

function processRegions(ocrCanvas, regions, sx, sy, cropW, cropH){
  const drawCtx = canvas.getContext("2d");

  regions.forEach(region=>{
    if(!scanning) return;

    const temp = document.createElement("canvas");
    temp.width = region.w; temp.height = region.h;
    const tctx = temp.getContext("2d");
    tctx.drawImage(ocrCanvas,region.x,region.y,region.w,region.h,0,0,region.w,region.h);

    Tesseract.recognize(temp,"eng",{tessedit_char_whitelist:"0123456789"})
    .then(({data})=>{
      const nums = data.text.match(/\d+/g)||[];
      nums.forEach(num=>{
        const last2 = num.slice(-2).padStart(2,"0");
        if(targets.includes(last2)){
          scanning=false;

          const scaleX = canvas.width/video.videoWidth;
          const scaleY = canvas.height/video.videoHeight;

          const rx = (sx + (region.x/ocrCanvas.width)*cropW)*scaleX;
          const ry = (sy + (region.y/ocrCanvas.height)*cropH)*scaleY;
          const rw = (region.w/ocrCanvas.width)*cropW*scaleX;
          const rh = (region.h/ocrCanvas.height)*cropH*scaleY;

          drawCtx.beginPath();
          drawCtx.lineWidth=4;
          drawCtx.strokeStyle="red";
          drawCtx.arc(rx+rw/2,ry+rh/2,Math.max(rw,rh)/2,0,Math.PI*2);
          drawCtx.stroke();

          output.innerText="命中："+last2;
          output.className="result match";

          autoSaveSnapshot();
          if(navigator.vibrate) navigator.vibrate([200,100,200]);
        }
      });
    });
  });

  if(scanning){
    output.innerText="掃描中...";
    output.className="result nomatch";
  }
}

// ---------------------- 相簿模式 ----------------------
function openGallery(){
  document.getElementById("fileInput").click();
}

document.getElementById("fileInput").addEventListener("change", handleImageFile);

async function handleImageFile(e){
  const file = e.target.files[0];
  if(!file) return;
  scanning=false;

  const img = new Image();
  img.onload = ()=> scanUploadedImage(img);
  img.src = URL.createObjectURL(file);
}

async function scanUploadedImage(img){
  const ctx = canvas.getContext("2d");
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img,0,0);

  output.innerText="辨識中...";

  const {data} = await Tesseract.recognize(canvas,"eng",{tessedit_char_whitelist:"0123456789"});
  let hit=false;

  data.words.forEach(w=>{
    const num=w.text.replace(/\D/g,"");
    if(!num) return;

    const last2 = num.slice(-2).padStart(2,"0");
    if(targets.includes(last2)){
      hit=true;

      const {x0,y0,x1,y1} = w.bbox;
      const cx=(x0+x1)/2;
      const cy=(y0+y1)/2;
      const r=Math.max(x1-x0,y1-y0)*0.7;

      ctx.beginPath();
      ctx.lineWidth=4;
      ctx.strokeStyle="red";
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.stroke();

      autoSaveSnapshot();
    }
  });

  output.innerText = hit ? "命中！" : "未命中";
  output.className = "result " + (hit ? "match" : "nomatch");
}

// ---------------------- 截圖 ----------------------
function autoSaveSnapshot(){
  const link=document.createElement("a");
  link.download="hit_"+Date.now()+".png";
  link.href=canvas.toDataURL("image/png");
  link.click();
}
</script>

</body>
</html>
