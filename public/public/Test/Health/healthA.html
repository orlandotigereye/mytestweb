<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金萌健康逆轉系統 😺💰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { font-size: 0.5rem; }
        body {
            background: #fff9e6 url('https://www.transparenttextures.com/patterns/cubes.png');
            font-family: "Hiragino Sans GB", "Microsoft JhengHei", sans-serif;
            margin: 0; padding: 0; min-height: 100vh;
            overflow-x: hidden;
        }
        .gold-sparkle {
            background: linear-gradient(135deg, #ffd700 0%, #ffecb3 50%, #daa520 100%);
            box-shadow: 0 4px 15px rgba(218, 165, 32, 0.4);
        }
        .cute-card {
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #ffd700;
            border-radius: 25px;
            box-shadow: 8px 8px 0px #daa520;
            transition: transform 0.2s;
        }
        .cute-card:hover { transform: translateY(-2px); }
        input, select, textarea {
            font-size: 0.5rem !important;
            border: 2px solid #ffe082;
            border-radius: 12px;
            padding: 0.5rem;
            background: #fffdf7;
            outline: none;
            width: 100%;
        }
        input:focus { border-color: #ffd700; background: #fff; }
        .cat-mascot {
            position: absolute;
            top: -25px; right: 10px;
            font-size: 2.5rem;
            filter: drop-shadow(2px 2px 0 white);
            cursor: pointer;
            z-index: 20;
        }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .progress-fill { transition: width 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }

        nav button { font-size: 0.5rem; transition: all 0.2s; }
        .active-nav { color: #b45309 !important; transform: scale(1.1); }
    </style>
</head>
<body class="pb-28">

    <!-- 背景裝飾 -->
    <div class="fixed inset-0 pointer-events-none opacity-20 z-0 overflow-hidden">
        <i class="fas fa-coins absolute text-yellow-500 animate-bounce" style="top:5%; left:5%; font-size: 2rem;"></i>
        <i class="fas fa-running absolute text-orange-400" style="top:15%; right:5%; font-size: 1.5rem;"></i>
        <i class="fas fa-bolt absolute text-yellow-400" style="bottom:25%; left:10%; font-size: 1.8rem;"></i>
    </div>

    <div class="relative z-10 max-w-md mx-auto p-4">
        <!-- 頂部標題 -->
        <header class="text-center py-6 relative">
            <div class="cat-mascot" onclick="meow()">🐈</div>
            <h1 class="text-3xl font-black text-yellow-700 tracking-tighter italic">GOLDEN V3 PRO</h1>
            <p class="text-yellow-600 font-bold bg-white/60 inline-block px-3 py-1 rounded-full border border-yellow-200">✨ 54歲逆轉：動起來！金光閃閃 ✨</p>
        </header>

        <!-- 快速資訊欄 -->
        <div id="quick-stats" class="grid grid-cols-4 gap-2 mb-6">
            <div class="cute-card p-2 text-center bg-white">
                <p class="text-gray-400 scale-90">體重</p>
                <p id="stat-w" class="text-lg font-bold text-yellow-600">--</p>
            </div>
            <div class="cute-card p-2 text-center bg-white">
                <p class="text-gray-400 scale-90">舒張壓</p>
                <p id="stat-dbp" class="text-lg font-bold text-pink-500">--</p>
            </div>
            <div class="cute-card p-2 text-center bg-white">
                <p class="text-gray-400 scale-90">運動</p>
                <p id="stat-exercise" class="text-lg font-bold text-green-500">0m</p>
            </div>
            <div class="cute-card p-2 text-center bg-white cursor-pointer" onclick="addWaterQuick()">
                <p class="text-gray-400 scale-90">飲水</p>
                <p id="stat-water" class="text-lg font-bold text-blue-500">0ml</p>
            </div>
        </div>

        <!-- 內容區 -->
        <main>
            <!-- 記錄分頁 -->
            <section id="page-input" class="page active">
                <div class="cute-card p-6">
                    <h2 class="text-xl font-bold text-yellow-800 mb-4 flex items-center">
                        <i class="fas fa-hand-holding-usd mr-2"></i> 今日健康存款
                    </h2>
                    
                    <div class="space-y-4">
                        <div class="flex space-x-3">
                            <div class="flex-1">
                                <label class="block font-bold text-gray-500 mb-1">體重 (kg)</label>
                                <input type="number" id="weight" step="0.1">
                            </div>
                            <div class="flex-1">
                                <label class="block font-bold text-gray-500 mb-1">收縮壓</label>
                                <input type="number" id="sbp">
                            </div>
                        </div>

                        <div class="flex space-x-3">
                            <div class="flex-1">
                                <label class="block font-bold text-gray-500 mb-1">舒張壓 (目標80)</label>
                                <input type="number" id="dbp">
                            </div>
                            <div class="flex-1">
                                <label class="block font-bold text-gray-500 mb-1">飲水 (ml)</label>
                                <input type="number" id="water-input">
                            </div>
                        </div>

                        <button onclick="handleSave()" class="w-full py-4 gold-sparkle text-white font-black text-xl rounded-2xl shadow-lg active:scale-95 transition-all">
                            💰 存入生理數據
                        </button>
                    </div>
                </div>
            </section>

            <!-- 運動分頁 -->
            <section id="page-exercise" class="page">
                <div class="cute-card p-6">
                    <h2 class="text-xl font-bold text-green-700 mb-4 flex items-center">
                        <i class="fas fa-running mr-2"></i> 運動時間存摺
                    </h2>
                    
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-green-50 p-4 rounded-2xl border-2 border-green-200 text-center">
                                <i class="fas fa-shoe-prints text-green-500 text-2xl mb-2"></i>
                                <label class="block font-bold text-green-700 text-[0.45rem]">跑步 (分鐘)</label>
                                <input type="number" id="run-min" placeholder="0" class="mt-2 text-center border-green-300">
                            </div>
                            <div class="bg-orange-50 p-4 rounded-2xl border-2 border-orange-200 text-center">
                                <i class="fas fa-child-reaching text-orange-500 text-2xl mb-2"></i>
                                <label class="block font-bold text-orange-700 text-[0.45rem]">跳動 (分鐘)</label>
                                <input type="number" id="jump-min" placeholder="0" class="mt-2 text-center border-orange-300">
                            </div>
                        </div>

                        <div class="bg-white p-2 rounded-xl">
                            <canvas id="exerciseChart" height="200"></canvas>
                        </div>

                        <button onclick="handleSaveExercise()" class="w-full py-4 bg-gradient-to-r from-green-400 to-emerald-600 text-white font-black text-xl rounded-2xl shadow-lg active:scale-95 transition-all">
                            🔥 存入運動汗水
                        </button>
                    </div>
                </div>
            </section>

            <!-- 歷史分頁 -->
            <section id="page-history" class="page">
                <div class="cute-card p-4">
                    <div class="flex justify-between items-center mb-4 px-2">
                        <h2 class="text-xl font-bold text-yellow-800">📜 金庫總覽</h2>
                        <button onclick="downloadCSV()" class="text-[0.4rem] bg-yellow-100 px-3 py-1 rounded-full border border-yellow-300 font-bold">下載 CSV</button>
                    </div>
                    <div id="history-list" class="space-y-3 max-h-96 overflow-y-auto pr-1">
                        <!-- 動態填充 -->
                    </div>
                </div>
            </section>

            <!-- 成就分頁 -->
            <section id="page-goals" class="page">
                <div class="cute-card p-4">
                    <h2 class="text-xl font-bold text-yellow-800 mb-4 text-center">🏆 榮耀獎盃櫃</h2>
                    <div class="space-y-6">
                        <!-- 體重進度 -->
                        <div class="bg-yellow-50 p-4 rounded-2xl border-2 border-dashed border-yellow-300">
                            <div class="flex justify-between mb-1">
                                <span class="font-bold text-yellow-700">體重減輕 (目標 78kg)</span>
                                <span id="weight-progress-text" class="font-mono">0%</span>
                            </div>
                            <div class="w-full bg-white rounded-full h-4 border border-yellow-200">
                                <div id="weight-bar" class="progress-fill bg-yellow-400 h-full rounded-full" style="width: 0%"></div>
                            </div>
                        </div>
                        
                        <!-- 運動進度 -->
                        <div class="bg-green-50 p-4 rounded-2xl border-2 border-dashed border-green-300">
                            <div class="flex justify-between mb-1">
                                <span class="font-bold text-green-700">本週運動總量</span>
                                <span id="exercise-progress-text" class="font-mono">0m</span>
                            </div>
                            <div class="w-full bg-white rounded-full h-4 border border-green-200">
                                <div id="exercise-bar" class="progress-fill bg-green-400 h-full rounded-full" style="width: 0%"></div>
                            </div>
                            <p class="text-[0.4rem] mt-1 text-gray-400">週目標：150 分鐘 (燃燒脂肪肝！)</p>
                        </div>

                        <div class="text-center py-4 bg-white/50 rounded-2xl">
                            <div class="text-4xl mb-1">🥇</div>
                            <p id="motivational-quote" class="font-bold text-yellow-800 italic px-4">"流下的每一滴汗，都是肝臟的微笑。"</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 底部導航 -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t-4 border-yellow-400 flex justify-around p-2 pb-6 z-50">
            <button onclick="navTo('input')" id="nav-input" class="flex flex-col items-center flex-1 py-2 text-gray-400">
                <i class="fas fa-notes-medical text-2xl mb-1"></i>
                <span>生理</span>
            </button>
            <button onclick="navTo('exercise')" id="nav-exercise" class="flex flex-col items-center flex-1 py-2 text-gray-400">
                <i class="fas fa-running text-2xl mb-1"></i>
                <span>運動</span>
            </button>
            <button onclick="navTo('history')" id="nav-history" class="flex flex-col items-center flex-1 py-2 text-gray-400">
                <i class="fas fa-history text-2xl mb-1"></i>
                <span>日誌</span>
            </button>
            <button onclick="navTo('goals')" id="nav-goals" class="flex flex-col items-center flex-1 py-2 text-gray-400">
                <i class="fas fa-trophy text-2xl mb-1"></i>
                <span>成就</span>
            </button>
        </nav>
    </div>

    <!-- 下載程式碼按鈕 -->
    <div class="fixed bottom-32 right-4 z-50">
        <button onclick="downloadCode()" class="w-12 h-12 bg-black text-white rounded-full shadow-2xl flex items-center justify-center opacity-50 hover:opacity-100 transition-all">
            <i class="fas fa-download"></i>
        </button>
    </div>

    <script>
        const CONFIG = {
            height: 170.9,
            targetWeight: 78.0,
            initialWeight: 83.6,
            targetExerciseWeekly: 150,
            storageKey: 'golden_health_v3_data'
        };

        let db = JSON.parse(localStorage.getItem(CONFIG.storageKey) || '[]');
        let chartInstance = null;

        function meow() {
            const cat = document.querySelector('.cat-mascot');
            cat.style.transform = 'scale(1.3) rotate(15deg)';
            setTimeout(() => cat.style.transform = 'scale(1) rotate(0deg)', 200);
            renderMsg("喵！流汗之後，金幣會滾滾而來喔！😺", "success");
        }

        function navTo(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${page}`).classList.add('active');
            
            document.querySelectorAll('nav button').forEach(b => {
                b.classList.remove('active-nav');
                b.classList.add('text-gray-400');
            });
            document.getElementById(`nav-${page}`).classList.add('active-nav');
            document.getElementById(`nav-${page}`).classList.remove('text-gray-400');

            if(page === 'history') refreshHistory();
            if(page === 'goals') refreshGoals();
            if(page === 'exercise') initChart();
        }

        function handleSave() {
            const weight = parseFloat(document.getElementById('weight').value);
            const sbp = parseInt(document.getElementById('sbp').value);
            const dbp = parseInt(document.getElementById('dbp').value);
            const water = parseInt(document.getElementById('water-input').value) || 0;
            const date = new Date().toLocaleDateString('zh-TW');

            if(!weight || !sbp || !dbp) {
                renderMsg("此處需要你提供生理數據 😺", "error");
                return;
            }

            const bmi = (weight / Math.pow(CONFIG.height/100, 2)).toFixed(1);
            updateOrAddEntry({ date, weight, sbp, dbp, water, bmi });
            
            triggerConfetti();
            renderMsg("生理存款已入庫！💰", "success");
            updateQuickStats();
        }

        function handleSaveExercise() {
            const run = parseInt(document.getElementById('run-min').value) || 0;
            const jump = parseInt(document.getElementById('jump-min').value) || 0;
            const date = new Date().toLocaleDateString('zh-TW');

            if(run === 0 && jump === 0) {
                renderMsg("運動時間不能是 0 唷 😺", "error");
                return;
            }

            updateOrAddEntry({ date, run, jump });
            
            triggerConfetti();
            renderMsg("運動汗水已存入！🔥", "success");
            updateQuickStats();
            initChart(); // 更新圖表
        }

        function updateOrAddEntry(newData) {
            const date = newData.date;
            let index = db.findIndex(d => d.date === date);
            if(index > -1) {
                db[index] = { ...db[index], ...newData, timestamp: Date.now() };
            } else {
                db.unshift({ ...newData, timestamp: Date.now(), weight: 0, sbp:0, dbp:0, water:0, run:0, jump:0 });
            }
            localStorage.setItem(CONFIG.storageKey, JSON.stringify(db));
        }

        function updateQuickStats() {
            if(db.length === 0) return;
            const latest = db[0];
            document.getElementById('stat-w').innerText = (latest.weight || '--') + 'k';
            document.getElementById('stat-dbp').innerText = latest.dbp || '--';
            document.getElementById('stat-exercise').innerText = ((latest.run || 0) + (latest.jump || 0)) + 'm';
            document.getElementById('stat-water').innerText = (latest.water || 0) + 'ml';
        }

        function refreshHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = db.length === 0 ? '<p class="text-center text-gray-400 py-20">金庫暫無記錄...</p>' : '';
            
            db.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-2xl border-2 border-yellow-200 shadow-sm relative overflow-hidden';
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[0.45rem] font-bold text-gray-300">${item.date}</p>
                            <div class="flex items-baseline space-x-2">
                                <span class="text-lg font-black text-yellow-700">${item.weight || '--'}kg</span>
                                <span class="text-[0.4rem] text-pink-500 font-bold">${item.sbp || '--'}/${item.dbp || '--'}</span>
                            </div>
                            <div class="flex space-x-3 mt-1">
                                <span class="text-[0.45rem] text-green-600 font-bold"><i class="fas fa-running"></i> ${item.run || 0}m</span>
                                <span class="text-[0.45rem] text-orange-600 font-bold"><i class="fas fa-child"></i> ${item.jump || 0}m</span>
                                <span class="text-[0.45rem] text-blue-500 font-bold"><i class="fas fa-tint"></i> ${item.water || 0}ml</span>
                            </div>
                        </div>
                        <button onclick="deleteData(${index})" class="text-gray-200 hover:text-red-400"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function initChart() {
            const ctx = document.getElementById('exerciseChart').getContext('2d');
            const last7Days = [...db].reverse().slice(-7);
            
            const labels = last7Days.map(d => d.date.split('/')[2] || d.date);
            const runData = last7Days.map(d => d.run || 0);
            const jumpData = last7Days.map(d => d.jump || 0);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '跑步 (分)',
                            data: runData,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: '跳動 (分)',
                            data: jumpData,
                            borderColor: '#f97316',
                            backgroundColor: 'rgba(249, 115, 22, 0.1)',
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { font: { size: 8 } } } },
                    scales: { 
                        y: { beginAtZero: true, ticks: { font: { size: 8 } } },
                        x: { ticks: { font: { size: 8 } } }
                    }
                }
            });
        }

        function refreshGoals() {
            if(db.length === 0) return;
            const latest = db[0];

            // 體重進度
            const weightP = Math.min(Math.max(((CONFIG.initialWeight - latest.weight) / (CONFIG.initialWeight - CONFIG.targetWeight)) * 100, 0), 100);
            document.getElementById('weight-bar').style.width = weightP + '%';
            document.getElementById('weight-progress-text').innerText = Math.round(weightP) + '%';
            
            // 本週運動量 (簡單計算最近 7 筆)
            const weeklyTotal = db.slice(0,7).reduce((acc, cur) => acc + (cur.run || 0) + (cur.jump || 0), 0);
            const exerciseP = Math.min((weeklyTotal / CONFIG.targetExerciseWeekly) * 100, 100);
            document.getElementById('exercise-bar').style.width = exerciseP + '%';
            document.getElementById('exercise-progress-text').innerText = weeklyTotal + 'm';
        }

        function deleteData(index) {
            Swal.fire({
                title: '移除記錄？',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: '移除',
                cancelButtonText: '取消'
            }).then((res) => {
                if(res.isConfirmed) {
                    db.splice(index, 1);
                    localStorage.setItem(CONFIG.storageKey, JSON.stringify(db));
                    refreshHistory();
                    updateQuickStats();
                }
            });
        }

        function renderMsg(msg, type) {
            Swal.fire({
                text: msg,
                icon: type,
                confirmButtonColor: '#ffd700',
                timer: 2000,
                showConfirmButton: false
            });
        }

        function triggerConfetti() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 }, colors: ['#ffd700', '#10b981', '#ffffff'] });
        }

        function downloadCSV() {
            if(db.length === 0) return;
            let csv = "\ufeff日期,體重,BMI,收縮壓,舒張壓,飲水,跑步(分),跳動(分)\n";
            db.forEach(d => {
                csv += `${d.date},${d.weight},${d.bmi},${d.sbp},${d.dbp},${d.water},${d.run},${d.jump}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `健康報告_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        function downloadCode() {
            const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'golden_health_v3.html';
            a.click();
        }

        window.onload = () => {
            navTo('input');
            updateQuickStats();
            const lines = document.documentElement.outerHTML.split('\n').length;
            console.log("目前實際行數預估:", lines + 50);
        };
    </script>
</body>
</html>
