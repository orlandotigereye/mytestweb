<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>隨手筆記智慧整理器 (離線單檔旗艦版)</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --border: #dce1e8;
    --text: #1e293b;
    --text-muted: #64748b;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --accent: #0ea5e9;
    --highlight-bg: #fef08a;
    --highlight-text: #854d0e;
    --drawer-bg: #ffffff;
    --shadow: 0 4px 12px rgba(0,0,0,0.08);
  }
  [data-theme="dark"] {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --primary: #3b82f6;
    --primary-hover: #60a5fa;
    --accent: #38bdf8;
    --highlight-bg: #713f12;
    --highlight-text: #fef08a;
    --drawer-bg: #1e293b;
    --shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100dvh;
    width: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app-container {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100%;
  }
  /* 頂部極簡導覽列 */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 6px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { opacity: 0.7; }
  .app-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .btn {
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .btn-paste { background: var(--accent); color: #fff; }
  .btn-copy { background: var(--primary); color: #fff; }
  .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 5px 8px; }
  .btn:active { transform: scale(0.97); }

  /* 主工作區：手機上下滿版貼邊 */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 6px;
    gap: 6px;
  }
  .panel {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .panel-input {
    height: 36%;
    min-height: 110px;
    flex-shrink: 0;
  }
  .panel-output {
    flex: 1;
    min-height: 140px;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 10px;
    background: rgba(100, 116, 139, 0.06);
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .badge {
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 10px;
    background: rgba(37, 99, 235, 0.12);
    color: var(--primary);
    font-weight: 600;
  }
  textarea {
    flex: 1;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 8px 10px;
    font-size: 14px;
    line-height: 1.45;
    background: transparent;
    color: var(--text);
    font-family: inherit;
  }
  /* 即時整理結果區：小字號一眼總覽 + 緊湊單換行 + 可直接編輯 */
  .output-box {
    flex: 1;
    width: 100%;
    overflow-y: auto;
    padding: 8px 10px;
    font-size: 12.5px;
    line-height: 1.42;
    color: var(--text);
    outline: none;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .output-box:empty::before {
    content: attr(data-placeholder);
    color: var(--text-muted);
    font-style: italic;
  }
  .hl-key {
    background: var(--highlight-bg);
    color: var(--highlight-text);
    padding: 0 3px;
    border-radius: 3px;
    font-weight: 600;
  }
  .sub-head {
    font-weight: 700;
    color: var(--primary);
  }

  /* 側邊隱藏抽屜 */
  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 90;
    display: none;
  }
  .drawer-backdrop.open { display: block; }
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 84%;
    max-width: 330px;
    background: var(--drawer-bg);
    z-index: 100;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: 15px;
  }
  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px dashed var(--border);
  }
  .setting-row:last-child { border-bottom: none; }
  input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--primary); }

  /* 自訂錯字庫 */
  .dict-form {
    display: flex;
    gap: 5px;
    margin-bottom: 8px;
  }
  .dict-form input {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 12.5px;
    background: var(--bg);
    color: var(--text);
  }
  .dict-list {
    max-height: 130px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
    font-size: 12px;
  }
  .dict-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 6px;
    border-bottom: 1px solid var(--border);
  }
  .dict-item:last-child { border-bottom: none; }
  .del-btn {
    color: #ef4444;
    background: none;
    border: none;
    font-size: 13px;
    cursor: pointer;
    padding: 0 4px;
  }

  /* 歷史紀錄清單 */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .history-item {
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    cursor: pointer;
  }
  .history-item:active { border-color: var(--primary); }
  .history-snippet {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .backup-row {
    display: flex;
    gap: 6px;
  }
  .backup-row button { flex: 1; justify-content: center; }

  /* Toast 提示 */
  .toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 23, 42, 0.9);
    color: #fff;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12.5px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s;
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 桌面寬螢幕自動轉左右雙欄 */
  @media (min-width: 768px) {
    main { flex-direction: row; padding: 10px; gap: 10px; }
    .panel-input { height: auto; flex: 1; }
    .panel-output { flex: 1.15; }
    .output-box { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="app-container">
  <header>
    <div class="header-left">
      <button class="icon-btn" id="openDrawerBtn" title="設定與歷史">☰</button>
      <span class="app-title">隨手筆記整理</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-paste" id="pasteBtn">📥 貼上整理</button>
      <button class="btn btn-copy" id="copyBtn">📋 一鍵複製</button>
      <button class="btn btn-clear" id="clearBtn" title="清空">清空</button>
    </div>
  </header>

  <main>
    <section class="panel panel-input">
      <div class="panel-header">
        <span>原始隨手輸入 (支援簡體/口語/無標點)</span>
        <span id="charCount">0 字</span>
      </div>
      <textarea id="rawInput" placeholder="在此隨手輸入或點擊右上「貼上整理」...&#10;例如：今天开会决定下周五前要把软件界面改好 第一版先确认颜色 第二版测试手机端顯示 因該没问题"></textarea>
    </section>

    <section class="panel panel-output">
      <div class="panel-header">
        <span>即時整理結果 <span class="badge">可點擊直接微調</span></span>
        <span id="statusTag">台灣正體・自動斷行</span>
      </div>
      <div id="outputPreview" class="output-box" contenteditable="true" data-placeholder="整理後的台灣正體筆記將即時顯示於此..."></div>
    </section>
  </main>
</div>

<!-- 側邊抽屜 -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <span>⚙️ 功能設定與紀錄</span>
    <button class="icon-btn" id="closeDrawerBtn">✕</button>
  </div>
  <div class="drawer-body">
    <div>
      <div class="section-title">排版與轉換規則</div>
      <label class="setting-row">
        <span>簡體轉台灣正體 (含慣用語)</span>
        <input type="checkbox" id="optS2T" checked>
      </label>
      <label class="setting-row">
        <span>常見錯別字自動修正</span>
        <input type="checkbox" id="optTypo" checked>
      </label>
      <label class="setting-row">
        <span>智慧補句點與緊湊斷行</span>
        <input type="checkbox" id="optPunct" checked>
      </label>
      <label class="setting-row">
        <span>重點詞句自動高亮標註</span>
        <input type="checkbox" id="optHighlight" checked>
      </label>
      <label class="setting-row">
        <span>深色護眼模式</span>
        <input type="checkbox" id="optDark">
      </label>
    </div>

    <div>
      <div class="section-title">自訂錯字替換庫</div>
      <div class="dict-form">
        <input type="text" id="typoWrong" placeholder="錯字 (如:因該)">
        <input type="text" id="typoRight" placeholder="正字 (如:應該)">
        <button class="btn btn-copy" id="addTypoBtn">新增</button>
      </div>
      <div class="dict-list" id="typoList"></div>
    </div>

    <div>
      <div class="section-title">備份與還原 (JSON)</div>
      <div class="backup-row">
        <button class="btn btn-clear" id="exportBtn">📤 匯出設定</button>
        <button class="btn btn-clear" id="importBtn">📥 匯入設定</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
    </div>

    <div>
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>歷史紀錄 (自動存檔)</span>
        <button class="del-btn" id="clearHistoryBtn" style="font-size:11px;">清除全部</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>
</aside>

<div class="toast" id="toast"></div>

// 簡轉繁核心函式
function convertS2T(text) {
  let res = text;
  // 先替換多字詞彙 (依長度由長到短)
  const keys = Object.keys(PHRASE_MAP).sort((a, b) => b.length - a.length);
  for (const k of keys) {
    if (res.includes(k)) {
      res = res.split(k).join(PHRASE_MAP[k]);
    }
  }
  // 再替換單字
  let out = "";
  for (const ch of res) {
    out += CHAR_MAP[ch] || ch;
  }
  return out;
}

// 錯字修正
function fixTypos(text) {
  let res = text;
  for (const item of state.customTypos) {
    if (item.wrong && item.right && res.includes(item.wrong)) {
      res = res.split(item.wrong).join(item.right);
    }
  }
  return res;
}

// 智慧標點與斷行排版引擎
function smartFormat(raw) {
  if (!raw.trim()) return { plain: "", html: "" };

  // 1. 保護英數字、小數點、網址、時間 (如 1.5, 10:30, v2.0)
  const protectedTokens = [];
  let text = raw.replace(/(https?:\/\/[^\s]+|[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+|\d+\.\d+|\d+:\d+|[A-Za-z0-9_.-]{2,})/g, (m) => {
    const id = `__TOK${protectedTokens.length}__`;
    protectedTokens.push(m);
    return id;
  });

  // 2. 簡轉繁與錯字修正
  if (state.s2t) text = convertS2T(text);
  if (state.typo) text = fixTypos(text);

  // 3. 標點符號正規化與智慧斷行
  if (state.punct) {
    // 統一常見半形標點為全形
    text = text
      .replace(/,/g, "，")
      .replace(/\?/g, "？")
      .replace(/!/g, "！")
      .replace(/;/g, "；")
      .replace(/:/g, "：")
      .replace(/\(/g, "（")
      .replace(/\)/g, "）");

    // 處理中文語境下的句點
    text = text.replace(/([一-龥])\./g, "$1。");

    // 將連續多個空白轉為逗號或斷句 (排除條列前綴)
    text = text.replace(/([一-龥])\s+([一-龥])/g, (_, p1, p2) => `${p1}，${p2}`);

    // 統一條列符號
    text = text.replace(/^[\-\*\•\·]\s*/gm, "• ");
    text = text.replace(/^(\d+)[、\.\)]\s*/gm, "$1. ");

    // 在句號、問號、驚嘆號後自動緊湊單換行
    text = text.replace(/([。！？])(?=[^\n」』）])/g, "$1\n");

    // 針對序數詞前自動換行 (如：第一、第二、1. 2.)
    text = text.replace(/([^\n])((?:第[一二三四五六七八九十\d]+[點項步版階段]?|[\d]+\.\s))/g, "$1\n$2");
  }

  // 還原受保護的英數字 Token
  text = text.replace(/__TOK(\d+)__/g, (_, idx) => protectedTokens[Number(idx)]);

  // 清理多餘空行，保持緊湊單換行
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

  const plainLines = [];
  const htmlLines = [];

  lines.forEach(line => {
    let currentLine = line;
    // 補上句尾句點 (若結尾無標點且非短標題)
    if (state.punct && currentLine.length > 4 && !/[。！？：；，、…\.\!\?]$/.test(currentLine) && !/^(\d+\.|•|▸)/.test(currentLine)) {
      currentLine += "。";
    }

    // 判斷是否為引言/小標題 (如以冒號結尾且較短)
    if (currentLine.length <= 22 && currentLine.endsWith("：")) {
      const formatted = `▸ ${currentLine}`;
      plainLines.push(formatted);
      htmlLines.push(`<span class="sub-head">${escapeHtml(formatted)}</span>`);
      return;
    }

    // 判斷是否觸發重點標註
    const isImportant = state.highlight && KEYWORD_TRIGGERS.some(kw => currentLine.includes(kw));
    if (isImportant) {
      const plainLine = `📌 【重點】${currentLine}`;
      plainLines.push(plainLine);
      htmlLines.push(`<span class="hl-key">📌 【重點】${escapeHtml(currentLine)}</span>`);
    } else {
      plainLines.push(currentLine);
      htmlLines.push(escapeHtml(currentLine));
    }
  });

  return {
    plain: plainLines.join("\n"),
    html: htmlLines.join("\n")
  };
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

  if (val.trim().length >= 6) {
    saveTimer = setTimeout(() => saveHistory(val, res.plain), 1500);
  }
}

rawInput.addEventListener("input", processNow);
rawInput.addEventListener("compositionend", processNow);

// 一鍵貼上並整理
document.getElementById("pasteBtn").addEventListener("click", async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (!text) {
      showToast("剪貼簿目前沒有文字");
      return;
    }
    rawInput.value = text;
    processNow();
    showToast("已貼上並完成整理！");
  } catch (err) {
    rawInput.focus();
    showToast("請長按輸入框貼上文字");
  }
});

// 一鍵複製整理結果
document.getElementById("copyBtn").addEventListener("click", async () => {
  const textToCopy = outputPreview.innerText.trim();
  if (!textToCopy) {
    showToast("目前沒有可複製的內容");
    return;
  }
  try {
    await navigator.clipboard.writeText(textToCopy);
    showToast("已複製整理後的筆記！");
  } catch (err) {
    const range = document.createRange();
    range.selectNodeContents(outputPreview);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand("copy");
    sel.removeAllRanges();
    showToast("已複製內容！");
  }
});

// 清空
document.getElementById("clearBtn").addEventListener("click", () => {
  rawInput.value = "";
  outputPreview.innerHTML = "";
  charCount.textContent = "0 字";
  rawInput.focus();
});

// 側邊抽屜控制
const drawer = document.getElementById("drawer");
const backdrop = document.getElementById("drawerBackdrop");
function toggleDrawer(open) {
  drawer.classList.toggle("open", open);
  backdrop.classList.toggle("open", open);
}
document.getElementById("openDrawerBtn").addEventListener("click", () => toggleDrawer(true));
document.getElementById("closeDrawerBtn").addEventListener("click", () => toggleDrawer(false));
backdrop.addEventListener("click", () => toggleDrawer(false));

// 設定開關綁定
["S2T", "Typo", "Punct", "Highlight"].forEach(key => {
  const el = document.getElementById("opt" + key);
  const stateKey = key.toLowerCase();
  el.checked = state[stateKey];
  el.addEventListener("change", () => {
    state[stateKey] = el.checked;
    processNow();
  });
});

const optDark = document.getElementById("optDark");
optDark.addEventListener("change", () => {
  state.dark = optDark.checked;
  document.documentElement.setAttribute("data-theme", state.dark ? "dark" : "light");
});

// 自訂錯字庫渲染與操作
function renderTypos() {
  const list = document.getElementById("typoList");
  list.innerHTML = "";
  state.customTypos.forEach((item, idx) => {
    const div = document.createElement("div");
    div.className = "dict-item";
    div.innerHTML = `<span>${escapeHtml(item.wrong)} → <b>${escapeHtml(item.right)}</b></span>
                     <button class="del-btn" data-idx="${idx}">✕</button>`;
    list.appendChild(div);
  });
  list.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const i = Number(e.target.dataset.idx);
      state.customTypos.splice(i, 1);
      localStorage.setItem("note_typos_v2", JSON.stringify(state.customTypos));
      renderTypos();
      processNow();
    });
  });
}

document.getElementById("addTypoBtn").addEventListener("click", () => {
  const w = document.getElementById("typoWrong").value.trim();
  const r = document.getElementById("typoRight").value.trim();
  if (!w || !r) return;
  state.customTypos.unshift({ wrong: w, right: r });
  localStorage.setItem("note_typos_v2", JSON.stringify(state.customTypos));
  document.getElementById("typoWrong").value = "";
  document.getElementById("typoRight").value = "";
  renderTypos();
  processNow();
  showToast("已新增錯字規則");
});

// 歷史紀錄 (前 16 字標題 + 日期時間)
function saveHistory(raw, formatted) {
  const cleanTitle = formatted.replace(/📌 【重點】|▸ /g, "").replace(/\s+/g, " ").trim().slice(0, 16);
  if (!cleanTitle) return;
  if (state.history.length > 0 && state.history[0].raw === raw) return;

  const now = new Date();
  const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;

  state.history.unshift({ title: cleanTitle, time: timeStr, raw });
  if (state.history.length > 25) state.history.pop();
  localStorage.setItem("note_history_v2", JSON.stringify(state.history));
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById("historyList");
  list.innerHTML = "";
  if (state.history.length === 0) {
    list.innerHTML = `<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:8px;">尚無歷史紀錄</div>`;
    return;
  }
  state.history.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `<div class="history-snippet">${escapeHtml(item.title)}...</div>
                     <div class="history-meta">${item.time}</div>`;
    div.addEventListener("click", () => {
      rawInput.value = item.raw;
      processNow();
      toggleDrawer(false);
      showToast("已載入歷史筆記");
    });
    list.appendChild(div);
  });
}

document.getElementById("clearHistoryBtn").addEventListener("click", () => {
  state.history = [];
  localStorage.removeItem("note_history_v2");
  renderHistory();
});

// 匯出與匯入備份
document.getElementById("exportBtn").addEventListener("click", () => {
  const data = JSON.stringify({ customTypos: state.customTypos, history: state.history }, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "note-organizer-backup.json";
  a.click();
});

const importFile = document.getElementById("importFile");
document.getElementById("importBtn").addEventListener("click", () => importFile.click());
importFile.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (parsed.customTypos) state.customTypos = parsed.customTypos;
      if (parsed.history) state.history = parsed.history;
      localStorage.setItem("note_typos_v2", JSON.stringify(state.customTypos));
      localStorage.setItem("note_history_v2", JSON.stringify(state.history));
      renderTypos();
      renderHistory();
      processNow();
      showToast("備份還原成功！");
    } catch {
      showToast("檔案格式錯誤");
    }
  };
  reader.readAsText(file);
});

// 初始化
renderTypos();
renderHistory();
processNow();
</script>
</body>
</html>
