<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>隨手筆記智慧整理器 (分頁旗艦版)</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --border: #dce1e8;
    --text: #1e293b;
    --text-muted: #64748b;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --accent: #0ea5e9;
    --highlight-bg: #fef08a;
    --highlight-text: #854d0e;
    --nav-bg: #ffffff;
    --shadow: 0 -2px 10px rgba(0,0,0,0.05);
  }
  [data-theme="dark"] {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --primary: #3b82f6;
    --primary-hover: #60a5fa;
    --accent: #38bdf8;
    --highlight-bg: #713f12;
    --highlight-text: #fef08a;
    --nav-bg: #1e293b;
    --shadow: 0 -2px 12px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100dvh;
    width: 100%;
    max-width: 100vw;
    overflow: hidden;
    overflow-x: hidden;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app-container {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* 頂部固定操作列 */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 100vw;
    padding: 6px 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 6px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1;
  }
  .app-title {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .code-stat {
    font-size: 0.62rem;
    color: var(--text-muted);
    background: rgba(100, 116, 139, 0.1);
    padding: 2px 6px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .btn {
    border: none;
    border-radius: 7px;
    height: 34px;
    padding: 0 9px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    touch-action: manipulation;
  }
  .btn-paste { background: var(--accent); color: #fff; }
  .btn-copy { background: var(--primary); color: #fff; padding: 0 11px; font-weight: 700; }
  .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0 8px; }
  .btn:active { transform: scale(0.97); }

  /* 分頁容器：一次只顯示一個分頁，絕無左右拉bar */
  .pages-wrapper {
    flex: 1;
    width: 100%;
    max-width: 100vw;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }
  .tab-page {
    display: none;
    flex-direction: column;
    width: 100%;
    max-width: 100vw;
    height: 100%;
    padding: 6px;
    gap: 6px;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .tab-page.active {
    display: flex;
  }
  /* 主整理分頁鎖定上下分配不整頁捲動 */
  #page-main {
    overflow: hidden;
  }

  .panel {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    overflow: hidden;
    min-height: 0;
  }
  .panel-input {
    height: 36%;
    min-height: 100px;
    max-height: 45%;
    flex-shrink: 0;
  }
  .panel-output {
    flex: 1;
    min-height: 130px;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    background: rgba(100, 116, 139, 0.06);
    border-bottom: 1px solid var(--border);
    font-size: 0.72rem;
    color: var(--text-muted);
    flex-shrink: 0;
    gap: 4px;
    overflow: hidden;
  }
  .panel-header > span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .header-meta-group {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .mini-action {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 0.68rem;
    cursor: pointer;
    touch-action: manipulation;
  }
  .mini-action:active {
    color: var(--primary);
    border-color: var(--primary);
  }
  .badge {
    font-size: 0.66rem;
    padding: 1px 6px;
    border-radius: 10px;
    background: rgba(37, 99, 235, 0.12);
    color: var(--primary);
    font-weight: 600;
    flex-shrink: 0;
  }
  textarea {
    flex: 1;
    width: 100%;
    max-width: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 8px 10px;
    font-size: 0.94rem;
    line-height: 1.48;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    overflow-y: auto;
    overflow-x: hidden;
    word-break: break-word;
    overflow-wrap: anywhere;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .output-box {
    flex: 1;
    width: 100%;
    max-width: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 8px 10px;
    font-size: 0.84rem;
    line-height: 1.48;
    color: var(--text);
    outline: none;
    word-break: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .output-box:empty::before {
    content: attr(data-placeholder);
    color: var(--text-muted);
    font-style: italic;
  }
  .hl-key {
    background: var(--highlight-bg);
    color: var(--highlight-text);
    padding: 0 3px;
    border-radius: 3px;
    font-weight: 600;
  }
  .sub-head {
    font-weight: 700;
    color: var(--primary);
  }

  /* 其他分頁卡片樣式 */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px;
    width: 100%;
    max-width: 100%;
  }
  .section-title {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 10px;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    font-size: 0.88rem;
    border-bottom: 1px dashed var(--border);
    cursor: pointer;
  }
  .setting-row:last-child { border-bottom: none; }
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }

  .dict-form {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .dict-form input {
    flex: 1;
    min-width: 0;
    height: 36px;
    padding: 0 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 0.85rem;
    background: var(--bg);
    color: var(--text);
  }
  .dict-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .dict-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 0.84rem;
  }
  .del-btn {
    color: #ef4444;
    background: none;
    border: none;
    min-width: 30px;
    min-height: 30px;
    font-size: 0.85rem;
    cursor: pointer;
    touch-action: manipulation;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    cursor: pointer;
    touch-action: manipulation;
  }
  .history-item:active { border-color: var(--primary); }
  .history-snippet {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-meta {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .backup-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .backup-row button { flex: 1; justify-content: center; min-width: 96px; height: 36px; }

  /* 底部四分頁導覽列 (完全取代側邊抽屜與左右滑動) */
  .bottom-nav {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    width: 100%;
    max-width: 100vw;
    background: var(--nav-bg);
    border-top: 1px solid var(--border);
    box-shadow: var(--shadow);
    flex-shrink: 0;
    z-index: 50;
  }
  .nav-item {
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 6px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    touch-action: manipulation;
    position: relative;
  }
  .nav-item .nav-icon {
    font-size: 1.05rem;
    line-height: 1.1;
  }
  .nav-item .nav-label {
    font-size: 0.68rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .nav-item.active {
    color: var(--primary);
  }
  .nav-item.active::after {
    content: "";
    position: absolute;
    top: 0;
    left: 22%;
    right: 22%;
    height: 2.5px;
    background: var(--primary);
    border-radius: 0 0 3px 3px;
  }

  .toast {
    position: fixed;
    bottom: calc(62px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: rgba(15, 23, 42, 0.92);
    color: #fff;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 0.78rem;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 370px) {
    .app-title { font-size: 0.8rem; }
    .code-stat { display: none; }
    .btn { padding: 0 7px; font-size: 0.73rem; }
    .btn-copy { padding: 0 9px; }
  }

  @media (min-width: 768px) {
    #page-main { flex-direction: row; padding: 10px; gap: 10px; }
    .panel-input { height: auto; max-height: none; flex: 1; }
    .panel-output { flex: 1.15; }
  }
</style>
</head>
<body>
<div class="app-container">
  <header>
    <div class="header-left">
      <span class="app-title">📝 筆記整理器</span>
      <span class="code-stat" id="codeStatTag">計算中...</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-paste" id="pasteBtn">📥貼上</button>
      <button class="btn btn-copy" id="copyBtn">📋一鍵複製</button>
      <button class="btn btn-clear" id="clearBtn" title="清空">清空</button>
    </div>
  </header>

  <div class="pages-wrapper">
    <!-- 分頁 1：筆記整理主畫面 -->
    <section class="tab-page active" id="page-main">
      <div class="panel panel-input">
        <div class="panel-header">
          <span>原始隨手輸入 (簡體/口語/無標點)</span>
          <div class="header-meta-group">
            <button class="mini-action" id="timeBtn" title="插入目前時間">時間</button>
            <button class="mini-action" id="sampleBtn" title="填入測試範例">範例</button>
            <span id="charCount">0 字</span>
          </div>
        </div>
        <textarea id="rawInput" enterkeyhint="enter" placeholder="在此隨手輸入或點擊右上「貼上」...&#10;例如：今天开会决定下周五前要把软件界面改好 第一版先确认颜色 第二版测试手机端顯示 因該没问题"></textarea>
      </div>

      <div class="panel panel-output">
        <div class="panel-header">
          <span>即時整理結果 <span class="badge">可點擊微調</span></span>
          <div class="header-meta-group">
            <button class="mini-action" id="syncBackBtn" title="將微調結果同步回輸入框">同步</button>
            <button class="mini-action" id="reformatBtn" title="重新套用排版規則">重整</button>
            <span id="statusTag">台灣正體</span>
          </div>
        </div>
        <div id="outputPreview" class="output-box" contenteditable="true" data-placeholder="整理後的台灣正體筆記將即時顯示於此..."></div>
      </div>
    </section>

    <!-- 分頁 2：排版規則與備份 -->
    <section class="tab-page" id="page-rules">
      <div class="card">
        <div class="section-title">⚙️ 排版與轉換規則</div>
        <label class="setting-row">
          <span>簡體轉台灣正體 (含慣用語)</span>
          <input type="checkbox" id="optS2T" checked>
        </label>
        <label class="setting-row">
          <span>常見錯別字自動修正</span>
          <input type="checkbox" id="optTypo" checked>
        </label>
        <label class="setting-row">
          <span>智慧補句點與緊湊斷行</span>
          <input type="checkbox" id="optPunct" checked>
        </label>
        <label class="setting-row">
          <span>重點詞句自動高亮標註</span>
          <input type="checkbox" id="optHighlight" checked>
        </label>
        <label class="setting-row">
          <span>深色護眼模式</span>
          <input type="checkbox" id="optDark">
        </label>
      </div>

      <div class="card">
        <div class="section-title">💾 備份還原與程式碼下載</div>
        <div class="backup-row">
          <button class="btn btn-clear" id="exportBtn">📤 匯出JSON</button>
          <button class="btn btn-clear" id="importBtn">📥 匯入JSON</button>
          <button class="btn btn-copy" id="downloadHtmlBtn">⬇️ 下載完整程式碼</button>
          <input type="file" id="importFile" accept=".json" style="display:none">
        </div>
        <div id="fileInfoFooter" style="margin-top:10px;font-size:0.72rem;color:var(--text-muted);text-align:center;"></div>
      </div>
    </section>

    <!-- 分頁 3：自訂錯字替換庫 -->
    <section class="tab-page" id="page-typos">
      <div class="card">
        <div class="section-title">📖 新增自訂錯字規則</div>
        <div class="dict-form">
          <input type="text" id="typoWrong" placeholder="錯字 (如:因該)">
          <input type="text" id="typoRight" placeholder="正字 (如:應該)">
          <button class="btn btn-copy" id="addTypoBtn">新增</button>
        </div>
        <div class="dict-list" id="typoList"></div>
      </div>
    </section>

    <!-- 分頁 4：歷史紀錄 -->
    <section class="tab-page" id="page-history">
      <div class="card">
        <div class="section-title">
          <span>🕒 歷史紀錄 (自動存檔，點擊載入)</span>
          <button class="del-btn" id="clearHistoryBtn" style="font-size:0.75rem;width:auto;padding:0 6px;">清除全部</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </section>
  </div>

  <!-- 底部固定分頁導覽列 -->
  <nav class="bottom-nav" aria-label="功能分頁切換">
    <button class="nav-item active" data-target="page-main">
      <span class="nav-icon">📝</span>
      <span class="nav-label">筆記整理</span>
    </button>
    <button class="nav-item" data-target="page-rules">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">排版設定</span>
    </button>
    <button class="nav-item" data-target="page-typos">
      <span class="nav-icon">📖</span>
      <span class="nav-label">錯字庫</span>
    </button>
    <button class="nav-item" data-target="page-history">
      <span class="nav-icon">🕒</span>
      <span class="nav-label">歷史紀錄</span>
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
const PHRASE_MAP = {

  "用户":"使用者","客户":"客戶","渠道":"管道","运营":"營運","营销":"行銷","推广":"推廣",

    typo: state.typo,
    punct: state.punct,
    highlight: state.highlight,
    dark: state.dark
  }));
}

const rawInput = document.getElementById("rawInput");
const outputPreview = document.getElementById("outputPreview");
const charCount = document.getElementById("charCount");
const statusTag = document.getElementById("statusTag");
const toastEl = document.getElementById("toast");

let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

// 分頁切換控制 (完全取代側拉抽屜)
const navItems = document.querySelectorAll(".nav-item");
const tabPages = document.querySelectorAll(".tab-page");
function switchTab(targetId) {
  navItems.forEach(btn => btn.classList.toggle("active", btn.dataset.target === targetId));
  tabPages.forEach(page => page.classList.toggle("active", page.id === targetId));
}
navItems.forEach(btn => {
  btn.addEventListener("click", () => switchTab(btn.dataset.target));
});

function convertS2T(text) {
  let res = text;
  const keys = Object.keys(PHRASE_MAP).sort((a, b) => b.length - a.length);
  for (const k of keys) {
    if (res.includes(k)) {
      res = res.split(k).join(PHRASE_MAP[k]);
    }
  }
  let out = "";
  for (const ch of res) {
    out += CHAR_MAP[ch] || ch;
  }
  return out;
}

function fixTypos(text) {
  let res = text;
  for (const item of state.customTypos) {
    if (item.wrong && item.right && res.includes(item.wrong)) {
      res = res.split(item.wrong).join(item.right);
    }
  }
  return res;
}

function smartFormat(raw) {
  if (!raw.trim()) return { plain: "", html: "" };

  const protectedTokens = [];
  let text = raw.replace(/(https?:\/\/[^\s]+|[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+|\d+\.\d+|\d+:\d+|[A-Za-z0-9_.-]{2,})/g, (m) => {
    const id = `__TOK${protectedTokens.length}__`;
    protectedTokens.push(m);
    return id;
  });

  if (state.s2t) text = convertS2T(text);
  if (state.typo) text = fixTypos(text);

  if (state.punct) {
    text = text
      .replace(/,/g, "，")
      .replace(/\?/g, "？")
      .replace(/!/g, "！")
      .replace(/;/g, "；")
      .replace(/:/g, "：")
      .replace(/\(/g, "（")
      .replace(/\)/g, "）");

    text = text.replace(/([一-龥])\./g, "$1。");
    text = text.replace(/([一-龥])\s+([一-龥])/g, (_, p1, p2) => `${p1}，${p2}`);

    text = text.replace(/^[\-\*\•\·]\s*/gm, "• ");
    text = text.replace(/^(\d+)[、\.\)]\s*/gm, "$1. ");

    text = text.replace(/([。！？])(?=[^\n」』）])/g, "$1\n");
    text = text.replace(/([^\n])((?:第[一二三四五六七八九十\d]+[點項步版階段]?|[\d]+\.\s))/g, "$1\n$2");
  }

  text = text.replace(/__TOK(\d+)__/g, (_, idx) => protectedTokens[Number(idx)]);

  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  const plainLines = [];
  const htmlLines = [];

  lines.forEach(line => {
    let currentLine = line;
    if (state.punct && currentLine.length > 4 && !/[。！？：；，、…\.\!\?]$/.test(currentLine) && !/^(\d+\.|•|▸)/.test(currentLine)) {
      currentLine += "。";
    }

    if (currentLine.length <= 22 && currentLine.endsWith("：")) {
      const formatted = `▸ ${currentLine}`;
      plainLines.push(formatted);
      htmlLines.push(`<span class="sub-head">${escapeHtml(formatted)}</span>`);
      return;
    }

    const isImportant = state.highlight && KEYWORD_TRIGGERS.some(kw => currentLine.includes(kw));
    if (isImportant) {
      const plainLine = `📌 【重點】${currentLine}`;
      plainLines.push(plainLine);
      htmlLines.push(`<span class="hl-key">📌 【重點】${escapeHtml(currentLine)}</span>`);
    } else {
      plainLines.push(currentLine);
      htmlLines.push(escapeHtml(currentLine));
    }
  });

  return {
    plain: plainLines.join("\n"),
    html: htmlLines.join("\n")
  };
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function updateStatusTag() {
  const parts = [];
  if (state.s2t) parts.push("正體");
  if (state.punct) parts.push("斷行");
  if (state.highlight) parts.push("重點");
  statusTag.textContent = parts.length ? parts.join("・") : "純文字";
}

let saveTimer = null;
function processNow() {
  const val = rawInput.value;
  const lineCount = val.trim() ? val.split(/\r?\n/).filter(l => l.trim()).length : 0;
  charCount.textContent = lineCount > 1 ? `${val.length}字/${lineCount}行` : `${val.length} 字`;
  const res = smartFormat(val);
  outputPreview.innerHTML = res.html;
  updateStatusTag();

  clearTimeout(saveTimer);
  if (val.trim().length >= 6) {
    saveTimer = setTimeout(() => saveHistory(val, res.plain), 1500);
  }
}

rawInput.addEventListener("input", processNow);
rawInput.addEventListener("compositionend", processNow);
rawInput.addEventListener("change", processNow);

document.getElementById("timeBtn").addEventListener("click", () => {
  const now = new Date();
  const stamp = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, "0")}/${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")} `;
  const start = rawInput.selectionStart ?? rawInput.value.length;
  const end = rawInput.selectionEnd ?? rawInput.value.length;
  rawInput.value = rawInput.value.slice(0, start) + stamp + rawInput.value.slice(end);
  rawInput.focus();
  const nextPos = start + stamp.length;
  rawInput.setSelectionRange(nextPos, nextPos);
  processNow();
  showToast("已插入目前時間");
});

document.getElementById("sampleBtn").addEventListener("click", () => {
  rawInput.value = "今天开会决定下周五前要把软件界面改好 第一版先确认颜色 第二版测试手机端顯示 務必确认登入帳號与账单流程 因該没问题";
  processNow();
  showToast("已填入測試範例");
});

document.getElementById("syncBackBtn").addEventListener("click", () => {
  const edited = outputPreview.innerText.trim();
  if (!edited) {
    showToast("結果區目前沒有內容");
    return;
  }
  rawInput.value = edited;
  processNow();
  showToast("已將微調內容同步回輸入框");
});

document.getElementById("reformatBtn").addEventListener("click", () => {
  processNow();
  showToast("已重新套用排版規則");
});

document.getElementById("pasteBtn").addEventListener("click", async () => {
  switchTab("page-main");
  try {
    const text = await navigator.clipboard.readText();
    if (!text) {
      showToast("剪貼簿目前沒有文字");
      return;
    }
    rawInput.value = text;
    processNow();
    showToast("已貼上並完成整理！");
  } catch {
    rawInput.focus();
    showToast("請長按輸入框貼上文字");
  }
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  const textToCopy = outputPreview.innerText.trim();
  if (!textToCopy) {
    showToast("目前沒有可複製的內容");
    return;
  }
  try {
    await navigator.clipboard.writeText(textToCopy);
    showToast("已複製整理後的筆記！");
  } catch {
    switchTab("page-main");
    const range = document.createRange();
    range.selectNodeContents(outputPreview);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand("copy");
    sel.removeAllRanges();
    showToast("已複製內容！");
  }
});

document.getElementById("clearBtn").addEventListener("click", () => {
  switchTab("page-main");
  rawInput.value = "";
  outputPreview.innerHTML = "";
  charCount.textContent = "0 字";
  rawInput.focus();
  showToast("已清空");
});

["S2T", "Typo", "Punct", "Highlight"].forEach(key => {
  const el = document.getElementById("opt" + key);
  const stateKey = key.toLowerCase();
  el.checked = state[stateKey];
  el.addEventListener("change", () => {
    state[stateKey] = el.checked;
    savePrefs();
    processNow();
  });
});

const optDark = document.getElementById("optDark");
optDark.checked = state.dark;
document.documentElement.setAttribute("data-theme", state.dark ? "dark" : "light");
optDark.addEventListener("change", () => {
  state.dark = optDark.checked;
  document.documentElement.setAttribute("data-theme", state.dark ? "dark" : "light");
  savePrefs();
});

function renderTypos() {
  const list = document.getElementById("typoList");
  list.innerHTML = "";
  state.customTypos.forEach((item, idx) => {
    const div = document.createElement("div");
    div.className = "dict-item";
    div.innerHTML = `<span>${escapeHtml(item.wrong)} → <b>${escapeHtml(item.right)}</b></span>
                     <button class="del-btn" data-idx="${idx}">✕</button>`;
    list.appendChild(div);
  });
  list.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const i = Number(e.target.dataset.idx);
      state.customTypos.splice(i, 1);
      localStorage.setItem("note_typos_v2", JSON.stringify(state.customTypos));
      renderTypos();
      processNow();
      showToast("已刪除規則");
    });
  });
}

document.getElementById("addTypoBtn").addEventListener("click", () => {
  const w = document.getElementById("typoWrong").value.trim();
  const r = document.getElementById("typoRight").value.trim();
  if (!w || !r) {
    showToast("請輸入錯字與正字");
    return;
  }
  state.customTypos.unshift({ wrong: w, right: r });
  localStorage.setItem("note_typos_v2", JSON.stringify(state.customTypos));
  document.getElementById("typoWrong").value = "";
  document.getElementById("typoRight").value = "";
  renderTypos();
  processNow();
  showToast("已新增錯字規則");
});

function saveHistory(raw, formatted) {
  const cleanTitle = formatted.replace(/📌 【重點】|▸ /g, "").replace(/\s+/g, " ").trim().slice(0, 16);
  if (!cleanTitle) return;
  if (state.history.length > 0 && state.history[0].raw === raw) return;

  const now = new Date();
  const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;

  state.history.unshift({ title: cleanTitle, time: timeStr, raw });
  if (state.history.length > 25) state.history.pop();
  localStorage.setItem("note_history_v2", JSON.stringify(state.history));
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById("historyList");
  list.innerHTML = "";
  if (state.history.length === 0) {
    list.innerHTML = `<div style="font-size:0.8rem;color:var(--text-muted);text-align:center;padding:16px;">尚無歷史紀錄</div>`;
    return;
  }
  state.history.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `<div class="history-snippet">${escapeHtml(item.title)}...</div>
                     <div class="history-meta">${item.time}</div>`;
    div.addEventListener("click", () => {
      rawInput.value = item.raw;
      processNow();
      switchTab("page-main");
      showToast("已載入歷史筆記");
    });
    list.appendChild(div);
  });
}

document.getElementById("clearHistoryBtn").addEventListener("click", () => {
  state.history = [];
  localStorage.removeItem("note_history_v2");
  renderHistory();
  showToast("已清除歷史紀錄");
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const data = JSON.stringify({ customTypos: state.customTypos, history: state.history }, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "note-organizer-backup.json";
  a.click();
  showToast("已匯出備份檔");
});

const importFile = document.getElementById("importFile");
document.getElementById("importBtn").addEventListener("click", () => importFile.click());
importFile.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (parsed.customTypos) state.customTypos = parsed.customTypos;
      if (parsed.history) state.history = parsed.history;
      localStorage.setItem("note_typos_v2", JSON.stringify(state.customTypos));
      localStorage.setItem("note_history_v2", JSON.stringify(state.history));
      renderTypos();
      renderHistory();
      processNow();
      showToast("備份還原成功！");
    } catch {
      showToast("檔案格式錯誤");
    }
  };
  reader.readAsText(file);
});

function updateCodeStats() {
  const fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const lineCount = fullHtml.split(/\r?\n/).length;
  const kbSize = (new Blob([fullHtml]).size / 1024).toFixed(1);
  const statText = `${lineCount} 行 · ${kbSize} KB`;
  document.getElementById("codeStatTag").textContent = statText;
  document.getElementById("fileInfoFooter").textContent = `目前單檔統計：${statText}`;
}

document.getElementById("downloadHtmlBtn").addEventListener("click", () => {
  const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "note-mobile-tabs.html";
  a.click();
  showToast("已下載完整 HTML 原始碼");
});

renderTypos();
renderHistory();
processNow();
updateCodeStats();
</script>
</body>
</html>
