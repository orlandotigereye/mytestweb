<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>隨手筆記智慧整理器 (離線單檔旗艦版)</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --border: #dce1e8;
    --text: #1e293b;
    --text-muted: #64748b;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --accent: #0ea5e9;
    --highlight-bg: #fef08a;
    --highlight-text: #854d0e;
    --drawer-bg: #ffffff;
    --shadow: 0 4px 12px rgba(0,0,0,0.08);
  }
  [data-theme="dark"] {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --primary: #3b82f6;
    --primary-hover: #60a5fa;
    --accent: #38bdf8;
    --highlight-bg: #713f12;
    --highlight-text: #fef08a;
    --drawer-bg: #1e293b;
    --shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100dvh;
    width: 100%;
    max-width: 100vw;
    overflow: hidden;
    overflow-x: hidden;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app-container {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 100vw;
    padding: 5px 6px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 4px;
    overflow: hidden;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    flex: 1;
  }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    min-width: 30px;
    height: 32px;
    padding: 0 7px;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .icon-btn:active { opacity: 0.7; transform: scale(0.96); }
  .app-title {
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .btn {
    border: none;
    border-radius: 6px;
    height: 32px;
    padding: 0 7px;
    font-size: 0.74rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
    touch-action: manipulation;
  }
  .btn-paste { background: var(--accent); color: #fff; }
  .btn-copy { background: var(--primary); color: #fff; padding: 0 9px; font-weight: 700; }
  .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0 6px; }
  .btn:active { transform: scale(0.97); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 100vw;
    overflow: hidden;
    padding: 6px;
    gap: 6px;
    min-height: 0;
  }
  .panel {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    min-height: 0;
  }
  .panel-input {
    height: 35%;
    min-height: 96px;
    max-height: 45%;
    flex-shrink: 0;
  }
  .panel-output {
    flex: 1;
    min-height: 120px;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
    background: rgba(100, 116, 139, 0.06);
    border-bottom: 1px solid var(--border);
    font-size: 0.7rem;
    color: var(--text-muted);
    flex-shrink: 0;
    gap: 4px;
    overflow: hidden;
  }
  .panel-header > span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .header-meta-group {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .mini-action {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 0.65rem;
    cursor: pointer;
    touch-action: manipulation;
  }
  .mini-action:active {
    color: var(--primary);
    border-color: var(--primary);
  }
  .badge {
    font-size: 0.65rem;
    padding: 1px 5px;
    border-radius: 10px;
    background: rgba(37, 99, 235, 0.12);
    color: var(--primary);
    font-weight: 600;
    flex-shrink: 0;
  }
  textarea {
    flex: 1;
    width: 100%;
    max-width: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 8px 10px;
    font-size: 0.92rem;
    line-height: 1.48;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    overflow-y: auto;
    overflow-x: hidden;
    word-break: break-word;
    overflow-wrap: anywhere;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .output-box {
    flex: 1;
    width: 100%;
    max-width: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 8px 10px;
    font-size: 0.8rem;
    line-height: 1.45;
    color: var(--text);
    outline: none;
    word-break: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .output-box:empty::before {
    content: attr(data-placeholder);
    color: var(--text-muted);
    font-style: italic;
  }
  .hl-key {
    background: var(--highlight-bg);
    color: var(--highlight-text);
    padding: 0 3px;
    border-radius: 3px;
    font-weight: 600;
  }
  .sub-head {
    font-weight: 700;
    color: var(--primary);
  }

  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 90;
    display: none;
  }
  .drawer-backdrop.open { display: block; }
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 84%;
    max-width: 330px;
    background: var(--drawer-bg);
    z-index: 100;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: 0.92rem;
  }
  .drawer-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .section-title {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 0.82rem;
    border-bottom: 1px dashed var(--border);
    cursor: pointer;
  }
  .setting-row:last-child { border-bottom: none; }
  input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

  .dict-form {
    display: flex;
    gap: 5px;
    margin-bottom: 8px;
  }
  .dict-form input {
    flex: 1;
    min-width: 0;
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.8rem;
    background: var(--bg);
    color: var(--text);
  }
  .dict-list {
    max-height: 130px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
    font-size: 0.76rem;
  }
  .dict-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 6px;
    border-bottom: 1px solid var(--border);
  }
  .dict-item:last-child { border-bottom: none; }
  .del-btn {
    color: #ef4444;
    background: none;
    border: none;
    min-width: 26px;
    min-height: 26px;
    font-size: 0.8rem;
    cursor: pointer;
    padding: 0 4px;
    touch-action: manipulation;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .history-item {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    cursor: pointer;
    touch-action: manipulation;
  }
  .history-item:active { border-color: var(--primary); }
  .history-snippet {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-meta {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .backup-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .backup-row button { flex: 1; justify-content: center; min-width: 90px; }

  .toast {
    position: fixed;
    bottom: calc(18px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 23, 42, 0.92);
    color: #fff;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 0.78rem;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 370px) {
    .app-title { font-size: 0.75rem; }
    .btn { padding: 0 5px; font-size: 0.7rem; }
    .btn-copy { padding: 0 7px; }
  }

  @media (min-width: 768px) {
    header { padding: 6px 10px; gap: 6px; }
    .btn { padding: 0 10px; font-size: 0.8rem; }
    main { flex-direction: row; padding: 10px; gap: 10px; }
    .panel-input { height: auto; max-height: none; flex: 1; }
    .panel-output { flex: 1.15; }
    .output-box { font-size: 0.82rem; }
    textarea { font-size: 0.88rem; }
  }
</style>
</head>
<body>
<div class="app-container">
  <header>
    <div class="header-left">
      <button class="icon-btn" id="openDrawerBtn" title="設定與歷史">☰</button>
      <span class="app-title">筆記整理</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-paste" id="pasteBtn">📥貼上</button>
      <button class="btn btn-copy" id="copyBtn">📋一鍵複製</button>
      <button class="btn btn-clear" id="clearBtn" title="清空">清空</button>
    </div>
  </header>

  <main>
    <section class="panel panel-input">
      <div class="panel-header">
        <span>原始隨手輸入 (簡體/口語/無標點)</span>
        <div class="header-meta-group">
          <button class="mini-action" id="timeBtn" title="插入目前時間">時間</button>
          <button class="mini-action" id="sampleBtn" title="填入測試範例">範例</button>
          <span id="charCount">0 字</span>
        </div>
      </div>
      <textarea id="rawInput" enterkeyhint="enter" placeholder="在此隨手輸入或點擊右上「貼上」...&#10;例如：今天开会决定下周五前要把软件界面改好 第一版先确认颜色 第二版测试手机端顯示 因該没问题"></textarea>
    </section>

    <section class="panel panel-output">
      <div class="panel-header">
        <span>即時整理結果 <span class="badge">可點擊微調</span></span>
        <div class="header-meta-group">
          <button class="mini-action" id="syncBackBtn" title="將微調結果同步回輸入框">同步</button>
          <button class="mini-action" id="reformatBtn" title="重新套用排版規則">重整</button>
          <span id="statusTag">台灣正體</span>
        </div>
      </div>
      <div id="outputPreview" class="output-box" contenteditable="true" data-placeholder="整理後的台灣正體筆記將即時顯示於此..."></div>
    </section>
  </main>
</div>

<!-- 側邊抽屜 -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <span>⚙️ 功能設定與紀錄</span>
    <button class="icon-btn" id="closeDrawerBtn">✕</button>
  </div>
  <div class="drawer-body">
    <div>
      <div class="section-title">排版與轉換規則</div>
      <label class="setting-row">
        <span>簡體轉台灣正體 (含慣用語)</span>
        <input type="checkbox" id="optS2T" checked>
      </label>
      <label class="setting-row">
        <span>常見錯別字自動修正</span>
        <input type="checkbox" id="optTypo" checked>
      </label>
      <label class="setting-row">
        <span>智慧補句點與緊湊斷行</span>
        <input type="checkbox" id="optPunct" checked>
      </label>
      <label class="setting-row">
        <span>重點詞句自動高亮標註</span>
        <input type="checkbox" id="optHighlight" checked>
      </label>
      <label class="setting-row">
        <span>深色護眼模式</span>
        <input type="checkbox" id="optDark">
      </label>
    </div>

    <div>
      <div class="section-title">自訂錯字替換庫</div>
      <div class="dict-form">
        <input type="text" id="typoWrong" placeholder="錯字 (如:因該)">
        <input type="text" id="typoRight" placeholder="正字 (如:應該)">
        <button class="btn btn-copy" id="addTypoBtn">新增</button>
      </div>
      <div class="dict-list" id="typoList"></div>
    </div>

    <div>
      <div class="section-title">備份還原與程式下載</div>
      <div class="backup-row">
        <button class="btn btn-clear" id="exportBtn">📤 匯出JSON</button>
        <button class="btn btn-clear" id="importBtn">📥 匯入JSON</button>
        <button class="btn btn-clear" id="downloadHtmlBtn">💾 下載HTML</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
    </div>

    <div>
      <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>歷史紀錄 (自動存檔)</span>
        <button class="del-btn" id="clearHistoryBtn" style="font-size:0.7rem;">清除全部</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
const PHRASE_MAP = {

  "鉴定":"鑑定","讲解":"講解","讲话":"講話","讲究":"講究","奖励":"獎勵","奖金":"獎金",

function convertS2T(text) {
  let res = text;
  const keys = Object.keys(PHRASE_MAP).sort((a, b) => b.length - a.length);
  for (const k of keys) {
    if (res.includes(k)) {
      res = res.split(k).join(PHRASE_MAP[k]);
    }
  }
  let out = "";
  for (const ch of res) {
    out += CHAR_MAP[ch] || ch;
  }
  return out;
}

function fixTypos(text) {
  let res = text;
  for (const item of state.customTypos) {
    if (item.wrong && item.right && res.includes(item.wrong)) {
      res = res.split(item.wrong).join(item.right);
    }
  }
  return res;
}

      .replace(/\)/g, "）");

    text = text.replace(/([一-龥])\./g, "$1。");
    text = text.replace(/([一-龥])\s+([一-龥])/g, (_, p1, p2) => `${p1}，${p2}`);

    text = text.replace(/^[\-\*\•\·]\s*/gm, "• ");
    text = text.replace(/^(\d+)[、\.\)]\s*/gm, "$1. ");

    text = text.replace(/([。！？])(?=[^\n」』）])/g, "$1\n");
    text = text.replace(/([^\n])((?:第[一二三四五六七八九十\d]+[點項步版階段]?|[\d]+\.\s))/g, "$1\n$2");
  }

  text = text.replace(/__TOK(\d+)__/g, (_, idx) => protectedTokens[Number(idx)]);

  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  const plainLines = [];
  const htmlLines = [];

  lines.forEach(line => {
    let currentLine = line;
    if (state.punct && currentLine.length > 4 && !/[。！？：；，、…\.\!\?]$/.test(currentLine) && !/^(\d+\.|•|▸)/.test(currentLine)) {
      currentLine += "。";
    }

    if (currentLine.length <= 22 && currentLine.endsWith("：")) {
      const formatted = `▸ ${currentLine}`;
      plainLines.push(formatted);
      htmlLines.push(`<span class="sub-head">${escapeHtml(formatted)}</span>`);
      return;
    }

    const isImportant = state.highlight && KEYWORD_TRIGGERS.some(kw => currentLine.includes(kw));
    if (isImportant) {
      const plainLine = `📌 【重點】${currentLine}`;
      plainLines.push(plainLine);
      htmlLines.push(`<span class="hl-key">📌 【重點】${escapeHtml(currentLine)}</span>`);
    } else {
      plainLines.push(currentLine);
      htmlLines.push(escapeHtml(currentLine));
    }
  });

  return {
    plain: plainLines.join("\n"),
    html: htmlLines.join("\n")
  };
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function updateStatusTag() {
  const parts = [];
  if (state.s2t) parts.push("正體");
  if (state.punct) parts.push("斷行");
  if (state.highlight) parts.push("重點");
  statusTag.textContent = parts.length ? parts.join("・") : "純文字";
}

let saveTimer = null;
function processNow() {
  const val = rawInput.value;
  const lineCount = val.trim() ? val.split(/\r?\n/).filter(l => l.trim()).length : 0;
  charCount.textContent = lineCount > 1 ? `${val.length}字/${lineCount}行` : `${val.length} 字`;
  const res = smartFormat(val);
  outputPreview.innerHTML = res.html;
  updateStatusTag();

  clearTimeout(saveTimer);
  if (val.trim().length >= 6) {
    saveTimer = setTimeout(() => saveHistory(val, res.plain), 1500);
  }
}

rawInput.addEventListener("input", processNow);
rawInput.addEventListener("compositionend", processNow);
rawInput.addEventListener("change", processNow);

document.getElementById("timeBtn").addEventListener("click", () => {
  const now = new Date();
  const stamp = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, "0")}/${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")} `;
  const start = rawInput.selectionStart ?? rawInput.value.length;
  const end = rawInput.selectionEnd ?? rawInput.value.length;
  rawInput.value = rawInput.value.slice(0, start) + stamp + rawInput.value.slice(end);
  rawInput.focus();
  const nextPos = start + stamp.length;
  rawInput.setSelectionRange(nextPos, nextPos);
  processNow();
  showToast("已插入目前時間");
});

document.getElementById("sampleBtn").addEventListener("click", () => {
  rawInput.value = "今天开会决定下周五前要把软件界面改好 第一版先确认颜色 第二版测试手机端顯示 務必确认登入帳號与账单流程 因該没问题";
  processNow();
  showToast("已填入測試範例");
});

document.getElementById("syncBackBtn").addEventListener("click", () => {
  const edited = outputPreview.innerText.trim();
  if (!edited) {
    showToast("結果區目前沒有內容");
    return;
  }
  rawInput.value = edited;
  processNow();
  showToast("已將微調內容同步回輸入框");
});

document.getElementById("reformatBtn").addEventListener("click", () => {
  processNow();
  showToast("已重新套用排版規則");
});

document.getElementById("pasteBtn").addEventListener("click", async () => {
  try {
    const text = await navigator.clipboard.readText();
    if (!text) {
      showToast("剪貼簿目前沒有文字");
      return;
    }
    rawInput.value = text;
    processNow();
    showToast("已貼上並完成整理！");
  } catch (err) {
    rawInput.focus();
    showToast("請長按輸入框貼上文字");
  }
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  const textToCopy = outputPreview.innerText.trim();
  if (!textToCopy) {
    showToast("目前沒有可複製的內容");
    return;
  }
  try {
    await navigator.clipboard.writeText(textToCopy);
    showToast("已複製整理後的筆記！");
  } catch (err) {
    const range = document.createRange();
    range.selectNodeContents(outputPreview);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    document.execCommand("copy");
    sel.removeAllRanges();
    showToast("已複製內容！");
  }
});

document.getElementById("clearBtn").addEventListener("click", () => {
  rawInput.value = "";
  outputPreview.innerHTML = "";
  charCount.textContent = "0 字";
  rawInput.focus();
  showToast("已清空");
});

const drawer = document.getElementById("drawer");
const backdrop = document.getElementById("drawerBackdrop");
function toggleDrawer(open) {
  drawer.classList.toggle("open", open);
  backdrop.classList.toggle("open", open);
}
document.getElementById("openDrawerBtn").addEventListener("click", () => toggleDrawer(true));
document.getElementById("closeDrawerBtn").addEventListener("click", () => toggleDrawer(false));
backdrop.addEventListener("click", () => toggleDrawer(false));

["S2T", "Typo", "Punct", "Highlight"].forEach(key => {
  const el = document.getElementById("opt" + key);
  const stateKey = key.toLowerCase();
  el.checked = state[stateKey];
  el.addEventListener("change", () => {
    state[stateKey] = el.checked;
    savePrefs();
    processNow();
  });
});

const optDark = document.getElementById("optDark");
optDark.checked = state.dark;
document.documentElement.setAttribute("data-theme", state.dark ? "dark" : "light");
optDark.addEventListener("change", () => {
  state.dark = optDark.checked;
  document.documentElement.setAttribute("data-theme", state.dark ? "dark" : "light");
  savePrefs();
});

function renderTypos() {
  const list = document.getElementById("typoList");
  list.innerHTML = "";
  state.customTypos.forEach((item, idx) => {
    const div = document.createElement("div");
    div.className = "dict-item";
    div.innerHTML = `<span>${escapeHtml(item.wrong)} → <b>${escapeHtml(item.right)}</b></span>
                     <button class="del-btn" data-idx="${idx}">✕</button>`;
    list.appendChild(div);
  });
  list.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const i = Number(e.target.dataset.idx);
      state.customTypos.splice(i, 1);
      localStorage.setItem("note_typos_v2", JSON.stringify(state.customTypos));
      renderTypos();
      processNow();
    });
  });
}

document.getElementById("addTypoBtn").addEventListener("click", () => {
  const w = document.getElementById("typoWrong").value.trim();
  const r = document.getElementById("typoRight").value.trim();
  if (!w || !r) return;
  state.customTypos.unshift({ wrong: w, right: r });
  localStorage.setItem("note_typos_v2", JSON.stringify(state.customTypos));
  document.getElementById("typoWrong").value = "";
  document.getElementById("typoRight").value = "";
  renderTypos();
  processNow();
  showToast("已新增錯字規則");
});

function saveHistory(raw, formatted) {
  const cleanTitle = formatted.replace(/📌 【重點】|▸ /g, "").replace(/\s+/g, " ").trim().slice(0, 16);
  if (!cleanTitle) return;
  if (state.history.length > 0 && state.history[0].raw === raw) return;

  const now = new Date();
  const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;

  state.history.unshift({ title: cleanTitle, time: timeStr, raw });
  if (state.history.length > 25) state.history.pop();
  localStorage.setItem("note_history_v2", JSON.stringify(state.history));
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById("historyList");
  list.innerHTML = "";
  if (state.history.length === 0) {
    list.innerHTML = `<div style="font-size:0.75rem;color:var(--text-muted);text-align:center;padding:8px;">尚無歷史紀錄</div>`;
    return;
  }
  state.history.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerHTML = `<div class="history-snippet">${escapeHtml(item.title)}...</div>
                     <div class="history-meta">${item.time}</div>`;
    div.addEventListener("click", () => {
      rawInput.value = item.raw;
      processNow();
      toggleDrawer(false);
      showToast("已載入歷史筆記");
    });
    list.appendChild(div);
  });
}

document.getElementById("clearHistoryBtn").addEventListener("click", () => {
  state.history = [];
  localStorage.removeItem("note_history_v2");
  renderHistory();
  showToast("已清除歷史紀錄");
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const data = JSON.stringify({ customTypos: state.customTypos, history: state.history }, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "note-organizer-backup.json";
  a.click();
  showToast("已匯出備份檔");
});

const importFile = document.getElementById("importFile");
document.getElementById("importBtn").addEventListener("click", () => importFile.click());
importFile.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (parsed.customTypos) state.customTypos = parsed.customTypos;
      if (parsed.history) state.history = parsed.history;
      localStorage.setItem("note_typos_v2", JSON.stringify(state.customTypos));
      localStorage.setItem("note_history_v2", JSON.stringify(state.history));
      renderTypos();
      renderHistory();
      processNow();
      showToast("備份還原成功！");
    } catch {
      showToast("檔案格式錯誤");
    }
  };
  reader.readAsText(file);
});

document.getElementById("downloadHtmlBtn").addEventListener("click", () => {
  const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "note-mobile-v2.html";
  a.click();
  showToast("已下載 HTML 原始碼");
});

renderTypos();
renderHistory();
processNow();
</script>
</body>
</html>
