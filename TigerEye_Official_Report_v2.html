// 動爻名稱
const YAO_NAMES = ["初九", "九二", "九三", "九四", "九五", "上九", "初六", "六二", "六三", "六四", "六五", "上六"];

// 預設 64 卦分數（基於卦象能量，範圍 400-900）
const DEFAULT_64GUA_SCORES = {
  "乾為天": 900, "坤為地": 850, "水雷屯": 520, "山水蒙": 480,
  "水天需": 620, "天水訟": 450, "地水師": 690, "水地比": 720,
  "風天小畜": 680, "天澤履": 650, "地天泰": 880, "天地否": 420,
  "天火同人": 750, "火天大有": 850, "地山謙": 620, "雷地豫": 580,
  "澤雷隨": 600, "山風蠱": 400, "地澤臨": 700, "風地觀": 650,
  "火雷噬嗑": 550, "山火賁": 600, "山地剝": 450, "地雷復": 700,
  "天雷无妄": 720, "山天大畜": 780, "山雷頤": 550, "澤風大過": 480,
  "坎為水": 500, "離為火": 820, "澤山咸": 640, "雷風恒": 700,
  "天山遁": 480, "雷天大壯": 760, "火地晉": 680, "地火明夷": 500,

  "澤地萃": 620, "地風升": 680, "澤水困": 480, "水風井": 600,
  "澤火革": 720, "火風鼎": 750, "震為雷": 780, "艮為山": 700,

// 預設 384 爻分數（基於 64 卦 × 6 爻，簡化為卦分 ± 爻位調整）
function generateDefault384Yao() {
  const scores = {};
  const yaoAdjust = [0, 30, 60, 60, 80, 50, 20]; // 初九~上九 調整值
  for (let gua in DEFAULT_64GUA_SCORES) {
    const base = DEFAULT_64GUA_SCORES[gua];
    for (let i = 1; i <= 6; i++) {
      const yang = `${gua}_九${["初","二","三","四","五","上"][i-1]}`;
      const yin = `${gua}_六${["初","二","三","四","五","上"][i-1]}`;
      const val = Math.min(950, Math.max(300, base + yaoAdjust[i] + Math.floor(Math.random()*40-20)));
      scores[yang] = val;
      scores[yin] = val - 10;
    }
  }
  return scores;
}

// 市場階段判定
function getMarketPhase(trend, risk, final) {
  if (final >= 75 && trend > risk * 1.5) return "主升";
  if (final >= 60 && trend > risk) return "盤整偏多";
  if (final < 50 && risk > trend * 0.8) return "修正";
  if (risk > 70 && final < 55) return "洗盤";
  if (trend < 40 && risk > 50) return "出貨";
  if (final >= 65) return "盤堅";
  return "觀望";
}

let custom384Scores = null;
let customEntryRules = null;
let default384Scores = generateDefault384Yao();

  try {

function saveMapping() {
  localStorage.setItem('tigereye_v2_mapping', JSON.stringify(guaMapping));

  const container = document.getElementById('guaMappingInputs');
  container.innerHTML = '';

function updateMapping(num, val) {
  guaMapping[num] = val;
  saveMapping();
}

function resetDefaults() {
  guaMapping = { 1: "坎", 2: "艮", 3: "震", 4: "巽", 5: "艮", 6: "乾", 7: "兌", 8: "坤", 9: "離" };

function clearJson() {
  custom64Scores = null;
  custom384Scores = null;
  customEntryRules = null;

// ===================== 核心運算 =====================

function numToGua(n) {
  n = ((n - 1) % 9) + 1;
  if (n === 5) n = 2; // 5=土=艮=2
  return guaMapping[n] || guaMapping[2];
}

function getBaseGua(stockCode) {
  const digits = stockCode.toString().replace(/\D/g, '');
  let sum = 0;
  for (let d of digits) sum += parseInt(d);
  while (sum > 9) {
    let s = 0;
    for (let d of sum.toString()) s += parseInt(d);
    sum = s;
  }
  if (sum === 0) sum = 8;
  return numToGua(sum);
}

function getDayBranch(ganzhi) {
  const m = ganzhi.match(/(子|丑|寅|卯|辰|巳|午|未|申|酉|戌|亥)日/);
  return m ? m[1] : "子";
}

function getUpperGua(dayBranch) {
  const num = BRANCH_MAP[dayBranch] || 1;
  return numToGua(num);
}

function getTodayGua(baseGua, upperGua) {
  return GUA64_NAMES[upperGua + baseGua] || "未知";
}

function getMovingYao(stockCode, dayBranch, ganzhi) {
  const digits = stockCode.toString().replace(/\D/g, '');
  let sum = 0;
  for (let d of digits) sum += parseInt(d);
  const branchNum = BRANCH_MAP[dayBranch] || 1;
  // 動爻 = (股票數字和 + 日支數 + 日干數) % 6，0則為6
  const dayStemMatch = ganzhi.match(/(甲|乙|丙|丁|戊|己|庚|辛|壬|癸)日/);
  const stemNum = dayStemMatch ? "甲乙丙丁戊己庚辛壬癸".indexOf(dayStemMatch[1]) + 1 : 1;
  let yao = ((sum + branchNum + stemNum) % 6);
  if (yao === 0) yao = 6;
  return yao;
}

function getYaoName(guaName, yaoNum) {
  // 簡化：陽爻用九，陰爻用六（實際應依卦象，這裡用預設邏輯）
  const yangPositions = {
    "乾為天": [1,2,3,4,5,6], "坤為地": [], "坎為水": [2,4,5], "離為火": [1,3,5],
    "震為雷": [1,2,4,5,6], "艮為山": [1,3,4,5,6], "巽為風": [1,2,4,5], "兌為澤": [1,2,3,4,6]
  };
  // 先取得卦的陰陽結構（簡化處理）
  const isYang = (guaName, pos) => {
    const known = yangPositions[guaName];
    if (known) return known.includes(pos);
    // 未知卦：用分數推測
    return (DEFAULT_64GUA_SCORES[guaName] || 600) > 600;
  };
  const prefix = isYang(guaName, yaoNum) ? "九" : "六";
  const names = ["初", "二", "三", "四", "五", "上"];
  return prefix + names[yaoNum - 1];
}

function getChangedGua(guaName, yaoNum) {
  // 變卦邏輯：動爻陰陽互換，上卦下卦可能變化
  // 簡化：根據動爻位置決定變卦（使用預設映射表）
  const changeMap = {
    "乾為天": ["天澤履","天火同人","天雷无妄","天風姤","天水訟","天山遁"],
    "坤為地": ["地雷復","地澤臨","地天泰","雷地大壯","水地比","山地剝"],
    "坎為水": ["水澤節","水雷屯","水火既濟","澤水困","雷水解","風水渙"],
    "離為火": ["火山旅","火風鼎","火水未濟","山水蒙","風火家人","天火同人"],
    "震為雷": ["雷地豫","雷澤歸妹","雷水解","雷風恒","雷天大壯","火雷噬嗑"],
    "艮為山": ["山火賁","山天大畜","山澤損","山風蠱","山水蒙","地山謙"],
    "巽為風": ["風天小畜","風火家人","風雷益","風澤中孚","風水渙","風地觀"],
    "兌為澤": ["澤水困","澤雷隨","澤天夬","澤火革","澤山咸","澤地萃"],
    "地山謙": ["地火明夷","地風升","坤為地","雷山小過","澤山咸","艮為山"],
    "雷山小過": ["雷火豐","雷澤歸妹","雷地豫","澤山咸","火山旅","純艮"],
    "火天大有": ["火澤睽","離為火","火雷噬嗑","火風鼎","火水未濟","乾為天"],
    "雷火豐": ["雷天大壯","雷風恒","震為雷","離為火","澤火革","火山旅"],
    "火地晉": ["火雷噬嗑","火水未濟","火澤睽","山地剝","水地比","坤為地"],
    "地水師": ["地澤臨","坤為地","地雷復","風水渙","山水蒙","坎為水"],
    "水地比": ["水澤節","水雷屯","坎為水","風地觀","山地剝","坤為地"],
    "山地剝": ["山火賁","山風蠱","山雷頤","坤為地","火地晉","艮為山"]
  };
  const list = changeMap[guaName];
  if (list && list[yaoNum - 1]) return list[yaoNum - 1];
  // 通用 fallback
  const allGuas = Object.values(GUA64_NAMES);
  let hash = 0;
  for (let c of guaName + yaoNum) hash = ((hash << 5) - hash) + c.charCodeAt(0);
  return allGuas[Math.abs(hash) % allGuas.length];
}

function getScore64(guaName) {
  if (custom64Scores && custom64Scores[guaName] !== undefined) return custom64Scores[guaName];
  if (custom64Scores && custom64Scores['64gua'] && custom64Scores['64gua'][guaName] !== undefined) return custom64Scores['64gua'][guaName];
  return DEFAULT_64GUA_SCORES[guaName] || 600;
}

function getScore384(guaName, yaoName) {
  const key1 = `${guaName}_${yaoName}`;
  if (custom384Scores && custom384Scores[key1] !== undefined) return custom384Scores[key1];
  if (custom384Scores && custom384Scores['384yao'] && custom384Scores['384yao'][key1] !== undefined) return custom384Scores['384yao'][key1];
  if (default384Scores[key1] !== undefined) return default384Scores[key1];
  // fallback
  return getScore64(guaName) + Math.floor(Math.random() * 60 - 30);
}

function parsePlanets(text) {
  const result = { 土星: 326.1, 火星: 258.0, 木星: 211.1, 金星: 165.8, 水星: 229.6, 太陽: 209.1 };
  const patterns = [
    /土星[^(]*\(鎮星\)?[:：]\s*([0-9.]+)/,
    /火星[^(]*\(熒惑\)?[:：]\s*([0-9.]+)/,
    /木星[^(]*\(歲星\)?[:：]\s*([0-9.]+)/,
    /金星[^(]*\(太白\)?[:：]\s*([0-9.]+)/,
    /水星[^(]*\(辰星\)?[:：]\s*([0-9.]+)/,
    /太陽[:：]\s*([0-9.]+)/
  ];
  const keys = ['土星', '火星', '木星', '金星', '水星', '太陽'];
  for (let i = 0; i < patterns.length; i++) {
    const m = text.match(patterns[i]);
    if (m) result[keys[i]] = parseFloat(m[1]);
  }
  return result;
}

function parseWuxing(text) {
  const result = { 木: 25, 火: 38, 土: 25, 金: 20, 水: 35 };
  const m = text.match(/木[:：]?\s*(\d+)/); if (m) result.木 = parseInt(m[1]);
  const m2 = text.match(/火[:：]?\s*(\d+)/); if (m2) result.火 = parseInt(m2[1]);
  const m3 = text.match(/土[:：]?\s*(\d+)/); if (m3) result.土 = parseInt(m3[1]);
  const m4 = text.match(/金[:：]?\s*(\d+)/); if (m4) result.金 = parseInt(m4[1]);
  const m5 = text.match(/水[:：]?\s*(\d+)/); if (m5) result.水 = parseInt(m5[1]);
  return result;
}

function calcHeavenScore(wuxing, moonPhase, societyLuck, cloudCover, jieqi, xiuyao) {
  // 天象分數計算
  let score = 50;
  // 五行平衡度
  const vals = Object.values(wuxing);
  const avg = vals.reduce((a,b)=>a+b,0)/5;
  const variance = vals.reduce((a,b)=>a+Math.abs(b-avg),0)/5;
  score += (30 - variance) * 0.5;
  // 月相
  if (moonPhase.includes("滿月") || moonPhase.includes("新月")) score += 10;
  else if (moonPhase.includes("上弦") || moonPhase.includes("下弦")) score += 5;
  // 社會氣運
  score += (societyLuck - 50) * 0.3;
  // 雲層（越少越好）
  score += (50 - cloudCover) * 0.15;
  // 節氣
  if (jieqi.includes("立春") || jieqi.includes("立夏") || jieqi.includes("立秋") || jieqi.includes("立冬")) score += 5;
  // 宿曜
  if (xiuyao.includes("守")) score += 3;
  return Math.min(100, Math.max(0, Math.round(score)));
}

function calcRiskScore(planets) {
  // Risk = 60% 土星 + 40% 火星（角度越大風險越高，簡化為角度/3.6）
  const saturnRisk = Math.min(100, planets.土星 / 3.6);
  const marsRisk = Math.min(100, planets.火星 / 3.6);
  let risk = Math.round(saturnRisk * 0.6 + marsRisk * 0.4);
  // 加入木星緩衝（角度接近太陽時降低風險）
  const jupiterBuffer = Math.abs(planets.木星 - planets.太陽) < 30 ? -5 : 0;
  risk = Math.min(100, Math.max(0, risk + jupiterBuffer));
  return risk;
}

function calcTrendScore(heavenScore, score64, score384) {
  // Trend = 40% 天象 + 35% 64卦 + 25% 384爻
  const s64n = Math.min(100, score64 / 10);
  const s384n = Math.min(100, score384 / 10);
  return Math.round(heavenScore * 0.40 + s64n * 0.35 + s384n * 0.25);
}

function calcFinalScore(trend, risk) {
  return Math.round(trend - risk * 0.30);
}

function calcEntryScore(final, risk, trend, stockCode) {
  // Entry Score：基於 Final 微調
  let entry = final + Math.round((100 - risk) * 0.15);
  entry += Math.floor(parseInt(stockCode.toString().slice(-1)) * 1.5);
  return Math.min(100, Math.max(0, entry));
}

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

  const upperGua = getUpperGua(dayBranch);
  const heavenScore = calcHeavenScore(wuxing, moonPhase, societyLuck, cloudCover, jieqi, xiuyao);
  const riskScore = calcRiskScore(planets);

  // 市場總結
  const marketTrend = Math.round(heavenScore * 0.6 + (100 - riskScore) * 0.4);
  const marketFinal = calcFinalScore(marketTrend, riskScore);
  const marketPhase = getMarketPhase(marketTrend, riskScore, marketFinal);

  // 解析股票
  const stocks = stockInput.split(/[,，\n\r\t]+/).map(s => s.trim()).filter(s => s);

function copyReport() {
  const text = document.getElementById('reportOutput').textContent;
  navigator.clipboard.writeText(text).then(() => alert('報告已複製到剪貼簿'));
}

function downloadReport() {
  const text = document.getElementById('reportOutput').textContent;
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `TigerEye_Report_v2_${new Date().toISOString().split('T')[0]}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}
